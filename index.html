{id:'reaction',n:'反应力测试',ic:'zap',c:'net',tp:'l',d:'测你的反应速度',

 k:function(){

{id:'notify',n:'通知自己',ic:'bell',c:'net',tp:'l',d:'定时推送浏览器通知',
 h:'<div class="card"><div class="row" style="margin:0"><input class="in" id="nfT" value="该休息一下了" style="flex:1"></div><div class="row" style="margin:0"><input class="in" id="nfB" value="起来走动走动，喝杯水" style="flex:1"></div><div class="row"><span class="lbl" style="margin:0">延迟</span><input class="in" id="nfS" type="number" value="10" style="width:80px"><span class="lbl" style="margin:0">秒</span><button id="nfGo">开始计时</button><button class="gh" id="nfP">申请权限</button></div><div class="msg" id="nfM"></div></div>',

{id:'shortlink',n:'短链接生成与还原',ic:'link',c:'net',tp:'l',d:'本机短链本 + 网页版服务',fr:[{n:'Reurl',url:'https://reurl.cc/'},{n:'新浪短链',url:'https://sina.lt/'}],
 h:'<div class="card"><h3>'+ic('link')+'创建本机短链</h3>'

  +'<div class="msg">本机短链可离线还原；外部短链需访问网络，受 CORS 限制可能失败。</div></div>',
 k:function(){

     +'<div style="font-size:11.5px;color:var(--mu)">'+short(x.c)+'</div>'

     +'<div class="row" style="margin:0"><button class="sm" data-o="'+i+'">打开</button><button class="gh sm" data-p="'+i+'">复制短链</button><button class="gh sm" data-d="'+i+'">删除</button></div></div>'}).join(''):'<div class="msg">还没有短链</div>';
   Array.prototype.forEach.call($('slL').querySelectorAll('[data-o]'),function(b){b.onclick=function(){window.open(all()[+b.dataset.o].u,'_blank')}});

   var a=all();if(a.some(function(x){return x.c===c}))return toast('短码已存在');
   a.unshift({c:c,u:u});store(K,a);$('slU').value='';$('slC').value='';draw();cp(short(c));
  };

document.addEventListener('click',function(e){if(lpPop&&!lpPop.contains(e.target))closePop()});
function bindPress(el){
 var t0=null,sx=0,sy=0,mv=0;
 function start(x,y){mv=0;sx=x;sy=y;clearTimeout(t0);t0=setTimeout(function(){if(!mv)showPop(el,el.dataset.t)},500)}
 function move(x,y){if(Math.abs(x-sx)>8||Math.abs(y-sy)>8){mv=1;clearTimeout(t0)}}
 function end(){clearTimeout(t0)}
 el.addEventListener('touchstart',function(e){start(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
 el.addEventListener('touchmove',function(e){move(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
 el.addEventListener('touchend',end);el.addEventListener('touchcancel',end);
 el.addEventListener('mousedown',function(e){if(e.button===0)start(e.clientX,e.clientY)});
 el.addEventListener('mousemove',function(e){move(e.clientX,e.clientY)});
 el.addEventListener('mouseup',end);el.addEventListener('mouseleave',end);
 el.addEventListener('contextmenu',function(e){e.preventDefault()});
}
function paint(){Array.prototype.forEach.call(document.querySelectorAll('#tabs .tb'),function(d){
 var on=d.dataset.n===curNav;d.classList.toggle('on',on);d.setAttribute('aria-selected',on?'true':'false')})}
function setTop(t,back,id){
 $('ttl').textContent=t;
 $('topR').innerHTML=(id?'<div class="ico-btn" id="fv" style="color:'+(isFav(id)?'var(--p)':'var(--mu)')+'">'+ic('star')+'</div>':'');
 var bk=$('bk');if(bk){bk.innerHTML=ic('back');bk.onclick=function(){history.length>1?history.back():go('home')}}
 if($('fv'))$('fv').onclick=function(){togFav(id)};
}
function blockWarn(url){
 var r=EMBED_BLOCK[url];
 if(!r)return '';
 return '<div class="warn blk">'+ic('info')+'<div><b>此源禁止在应用内嵌入：</b>'+r+'。<br>请点下方“用浏览器打开”按钮访问原站。</div>'
  +'<a class="blkopen" href="'+url+'" target="_blank" rel="noopener">用浏览器打开 ↗</a></div>';
}
function frameCard(t){
 if(!t.fr)return '';
 var tabs=t.fr.map(function(f,i){return '<button class="'+(i?'':'on')+'" data-i="'+i+'">'+esc(f.n)+'</button>'}).join('');
 var links=t.fr.map(function(f){return '<a href="'+f.url+'" target="_blank" rel="noopener">'+esc(f.n)+' ↗</a>'}).join('');
 var allow='allow="camera;microphone;gyroscope;accelerometer;magnetometer;geolocation;notifications;clipboard-read;clipboard-write;fullscreen;display-capture"';
 return '<div class="card"><h3>'+ic('globe')+'网页版</h3>'
  +'<div id="frw">'+blockWarn(t.fr[0].url)+'</div>'
  +'<div class="frames" id="frb">'+tabs+'</div>'
  +'<div class="frbar">'+links+'<span class="frhint">若页面空白/被拦截，点上方链接用浏览器打开</span></div>'
  +'<div class="fw"><iframe id="frI" src="'+t.fr[0].url+'" referrerpolicy="no-referrer" '+allow+' sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe></div>'
  +disc()+'</div>';
}
function initFrames(t){
 var f=$('frI'),b=$('frb');if(!f||!b||!t.fr)return;
 Array.prototype.forEach.call(b.children,function(x){x.onclick=function(){
  Array.prototype.forEach.call(b.children,function(z){z.classList.remove('on')});x.classList.add('on');
  var u=t.fr[+x.dataset.i].url;f.src=u;var w=$('frw');if(w)w.innerHTML=blockWarn(u)}});
}
function bindDrawer(root,accordion){
 var ds=root.querySelectorAll('.dw');
 Array.prototype.forEach.call(ds,function(d){
  var hd=d.querySelector('.dwh');if(!hd)return;
  hd.onclick=function(){
   var open=d.classList.contains('on');
   if(accordion)Array.prototype.forEach.call(ds,function(z){z.classList.remove('on')});
   d.classList.toggle('on',!open);
  };
 });
}
var tb=$('thm');if(tb)tb.onclick=function(){setTheme(themeNow()==='dark'?'light':'dark',true,true)};
setTheme(themeNow(),false,false);
(function(){try{
 var mq=window.matchMedia&&matchMedia('(prefers-color-scheme:dark)');if(!mq)return;
 var onSys=function(){
  var s=null;try{s=localStorage.getItem('amu_theme')}catch(e){}
  if(s==='dark'||s==='light')return;
  setTheme(mq.matches?'dark':'light',false,false);
 };
 if(mq.addEventListener)mq.addEventListener('change',onSys);
 else if(mq.addListener)mq.addListener(onSys);
}catch(e){}})();
var cur=null,curNav='home';
function openTool(id){
 var t=T(id);if(!t)return go('home');
 if(cur&&cur.clear)cur.clear();cur=t;curNav='home';
 setTop(t.n,true,id);
 var banner='';
 var header='<div class="card" style="display:flex;gap:11px;align-items:center;padding:12px 14px"><div class="bi" style="width:34px;height:34px;border-radius:50%;background:rgba(52,112,238,.12);color:var(--p);display:grid;place-items:center;font-size:17px">'+ic(t.ic)+'</div><div><b style="font-size:15px;font-weight:500">'+t.n+'</b><div style="font-size:11.5px;color:var(--mu)">'+t.d+'</div></div></div>';
 MAIN.innerHTML='<div class="pg">'+tabsHtml()+header+banner+(t.h||'')+frameCard(t)+'</div>';
 if(t.k)t.k();initFrames(t);bindTabs();
 var r=store('amu_recent')||[];r=r.filter(function(x){return x!==id});r.unshift(id);store('amu_recent',r.slice(0,8));
 bind();window.scrollTo(0,0);paint();
}
function pageHome(){
 curNav='home';setTop('清风Studio-kit');
 var r=(store('amu_recent')||[]).map(T).filter(Boolean).slice(0,4);
 var h='<div class="pg"><div class="seek">'+ic('seek')+'<input id="sk" placeholder="搜索工具，如 翻译 / 二维码"></div>'+tabsHtml();
 if(r.length)h+='<div class="sec"><h2>最近使用</h2></div><div class="grid f">'+visList(r).map(tile).join('')+'</div>';
 h+='<div class="dw" id="cdw"><div class="dwh" data-dw="1"><div class="bi">'+ic('cat')+'</div><div class="tx"><b>全部分类</b><span>'+CATS.length+' 类 · '+TOOLS.length+' 个工具 · 点击展开</span></div><span class="cv">'+ic('chev','18px')+'</span></div><div class="dwb"><div class="in2"><div class="cgrid">'
  +CATS.map(function(c){var n=TOOLS.filter(function(t){return t.c===c.id}).length;
    return '<div class="cchip" data-c="'+c.id+'"><div class="bi">'+ic(c.ic)+'</div><b>'+c.n+'</b><em>'+n+'</em></div>'}).join('')
  +'</div></div></div></div>';
 h+='<div class="sec"><h2>全部工具</h2><em id="cnt"></em></div><div class="grid" id="allg">'+pinSort(visList(TOOLS)).map(tile).join('')+'</div></div>';
 MAIN.innerHTML=h;bind();bindTabs();
 bindDrawer(MAIN,false);
 Array.prototype.forEach.call(MAIN.querySelectorAll('[data-c]'),function(e){e.onclick=function(){location.hash='#/c/'+e.dataset.c}});
 $('sk').oninput=function(){
  var v=this.value.trim().toLowerCase(),g=MAIN.querySelector('#allg'),c=MAIN.querySelectorAll('#cdw');
  var m=TOOLS.filter(function(t){return !v||(t.n+t.d+t.id).toLowerCase().indexOf(v)>=0});
  g.innerHTML=pinSort(visList(m)).map(tile).join('')||'<div class="msg" style="grid-column:1/-1">没有找到相关工具</div>';
  Array.prototype.forEach.call(c,function(e){e.style.display=v?'none':''});
  bind();updateCnt();
 };
 function updateCnt(){var e=MAIN.querySelector('#cnt');if(e)e.textContent='显示 '+MAIN.querySelectorAll('#allg .tile').length+' 个'}
 updateCnt();
 paint();
}
function pageCat(){
 curNav='cat';setTop('分类');
 MAIN.innerHTML='<div class="pg">'+tabsHtml()+CATS.map(function(c){
  var l=pinSort(visList(TOOLS.filter(function(t){return t.c===c.id})));
  return '<div class="dw"><div class="dwh" data-dw="1"><div class="bi">'+ic(c.ic)+'</div><div class="tx"><b>'+c.n+'</b><span>'+l.length+' 个工具 · '+c.d+'</span></div><span class="cv">'+ic('chev','18px')+'</span></div>'
   +'<div class="dwb"><div class="in2"><div class="grid">'+l.map(tile).join('')+'</div></div></div></div>'}).join('')+'</div>';
 bindDrawer(MAIN,true);bind();bindTabs();
 paint();
}
function pageCatOne(id){
 var c=CATS.find(function(x){return x.id===id});if(!c)return go('cat');
 curNav='cat';setTop(c.n,true);
 var l=pinSort(visList(TOOLS.filter(function(t){return t.c===id})));
 MAIN.innerHTML='<div class="pg">'+tabsHtml()+'<div class="grid">'+l.map(tile).join('')+'</div></div>';
 bind();bindTabs();paint();
}
function pageFav(){
 curNav='fav';setTop('我的收藏');
 var f=pinSort(visList(favs().map(T).filter(Boolean)));
 MAIN.innerHTML='<div class="pg">'+tabsHtml()+(f.length?'<div class="grid">'+f.map(tile).join('')+'</div>':'<div class="empty">'+ic('star','34px')+'还没有收藏，在工具页点击右上角星标添加</div>')+'</div>';
 bind();bindTabs();paint();
}
function pageMe(){
 curNav='me';setTop('我的');
 var R=(store('amu_recent')||[]).length,D=store('amu_days'),H=hidden().map(T).filter(Boolean);
 MAIN.innerHTML='<div class="pg">'+tabsHtml()+'<div class="card"><h3>'+ic('me')+'数据统计</h3><div class="stat"><div class="st"><b>'+TOOLS.length+'</b><span>工具总数</span></div><div class="st"><b>'+favs().length+'</b><span>收藏</span></div><div class="st"><b>'+R+'</b><span>最近使用</span></div><div class="st"><b>'+((D||[]).length)+'</b><span>纪念日</span></div><div class="st"><b style="font-size:15px">'+APP_VER+'</b><span>版本</span></div></div></div>'
  +'<div class="card"><h3>'+ic('globe')+'关于</h3><div style="font-size:13px;line-height:1.9;color:var(--tx)"><b>'+APP_NAME+' · v'+APP_VER+'</b><br>单文件网页工具箱，参照一个木涵的功能组织方式。<br>画板、弹幕、纪念日、配色、切图、二维码、进制、三种计算器全部在本地完成，不上传任何数据。<br>翻译、汇率、IP 走公开免费接口；测速、下载、邮编等为第三方站点内嵌。<br>所有记录保存在本机浏览器，不上传服务器。</div></div>'
  +(H.length?'<div class="card"><h3>'+ic('hide')+'已隐藏工具</h3><div class="row" style="margin:0">'+H.map(function(t){return '<button class="gh sm" data-un="'+t.id+'">恢复 '+t.n+'</button>'}).join('')+'</div><div class="row"><button class="gh sm" id="m4">全部恢复</button></div></div>':'')
  +'<div class="card"><h3>'+ic('cat')+'数据管理</h3><div class="row" style="margin:0"><button class="gh sm" id="m1">清空最近使用</button><button class="gh sm" id="m2">清空收藏</button><button class="gh sm" id="m3">清空纪念日</button><button class="gh sm" id="m5">清空置顶</button></div></div>'
  +disc()+'</div>';
 $('m1').onclick=function(){store('amu_recent',[]);toast('已清空')};
 $('m2').onclick=function(){store('amu_fav',[]);toast('已清空')};
 $('m3').onclick=function(){store('amu_days',[]);toast('已清空')};
 $('m5').onclick=function(){store('amu_pin',[]);toast('已清空置顶')};
 bindTabs();
 if($('m4'))$('m4').onclick=function(){store('amu_hide',[]);toast('已全部恢复');route()};
 Array.prototype.forEach.call(MAIN.querySelectorAll('[data-un]'),function(b){b.onclick=function(){
  var hd=hidden().filter(function(x){return x!==b.dataset.un});store('amu_hide',hd);toast('已恢复');route()}});
 paint();
}
function shortOpen(c){
 var a=store('amu_links')||[],hit=a.filter(function(x){return x.c===c})[0];
 if(!hit){MAIN.innerHTML='<div class="pg"><div class="empty">'+ic('link','34px')+'短码不存在：'+esc(c||'')+'</div></div>';paint();return}
 MAIN.innerHTML='<div class="pg"><div class="card"><h3>'+ic('link')+'短链跳转</h3><div class="out">'+esc(hit.u)+'</div><div class="row"><button id="soG">立即打开</button><button class="gh" id="soB">返回工具箱</button></div></div></div>';
 $('soG').onclick=function(){location.href=hit.u};
 $('soB').onclick=function(){go('home')};
 setTimeout(function(){location.href=hit.u},1200);
 paint();
}
function route(){
 var h=location.hash.replace(/^#\/?/,''),p=h.split('/');
 if(cur&&cur.clear&&p[0]!=='t'){cur.clear();cur=null}
 if(p[0]==='s'){shortOpen(p[1]);return}
 if(p[0]==='t')openTool(p[1]);
 else if(p[0]==='c'||p[0]==='cat')p[1]?pageCatOne(p[1]):pageCat();
 else if(p[0]==='fav')pageFav();
 else if(p[0]==='me')pageMe();
 else pageHome();
}
addEventListener('hashchange',route);
route();
</script>
</body>
