<style data-page-node-id="U6P26CrkgV8i6tfE5IRK4f" data-pnid-children="NLfcIrSCmZcQHby3vBBsyG">
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--p:#3470EE;--p7:#2F5FC6;--bg:#F5F5F5;--tx:#1F1F1F;--mu:#757575;--bd:#E0E0E0;--ok:#0F9D58;--er:#D93025;--nav:56px;color-scheme:light;--surf:#fff;--surf2:#F5F5F5;--pb:#3470EE;--ghbg:#E0E0E0;--ghtx:#3C4043;
--e1:0 1px 3px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.08);--e2:0 2px 8px rgba(0,0,0,.16),0 1px 3px rgba(0,0,0,.10)}
html,body{height:100%}
body{font:14px/1.55 Roboto,"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
input,textarea,select,button{font:inherit;color:inherit}
svg.ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.top{position:sticky;top:0;z-index:8;background:var(--surf);box-shadow:var(--e1);display:flex;align-items:center;gap:6px;padding:0 6px 0 4px;height:52px}
.top h1{font-size:16px;font-weight:500;flex:1;letter-spacing:.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ico-btn{width:40px;height:40px;border-radius:50%;background:none;border:0;display:grid;place-items:center;font-size:20px;color:var(--mu);cursor:pointer}
.ico-btn:active{background:rgba(0,0,0,.08)}
.sbar{height:calc(env(safe-area-inset-top,0px) + 22px);background:var(--bg);flex:0 0 auto}
main{padding:12px 14px 24px;max-width:1000px;margin:0 auto}
.pg{animation:in .18s cubic-bezier(.4,0,.2,1) both}
@keyframes in{from{opacity:0}to{opacity:1}}
.seek{position:relative;margin-bottom:10px}
.seek .ic{position:absolute;left:14px;top:12px;font-size:18px;color:var(--mu)}
.seek input{width:100%;height:44px;padding:0 12px 0 44px;border:0;border-radius:2px;background:var(--surf);box-shadow:var(--e1);outline:0}
.seek input:focus{box-shadow:var(--e2)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid.f{grid-template-columns:repeat(4,1fr);gap:6px}
.tile{background:var(--surf);border-radius:2px;padding:10px 4px 8px;text-align:center;cursor:pointer;box-shadow:var(--e1);position:relative;transition:background .15s,box-shadow .15s}
.tile:active{background:var(--surf2);box-shadow:var(--e2)}
.tile .bi{width:32px;height:32px;margin:0 auto 6px;border-radius:50%;background:rgba(52,112,238,.12);display:grid;place-items:center;font-size:15px;color:var(--p)}
.tile b{display:block;font-size:12px;font-weight:500;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile span{display:block;font-size:10px;color:var(--mu);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.fav::after{content:"";position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--p)}
.sec{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px}
.sec h2{font-size:13px;font-weight:500;color:var(--mu);letter-spacing:.5px}
.sec em{font-style:normal;font-size:11.5px;color:var(--mu)}
.dw{background:var(--surf);border-radius:2px;box-shadow:var(--e1);margin-bottom:8px;overflow:hidden}
.dwh{display:flex;align-items:center;gap:11px;padding:12px 14px;cursor:pointer;user-select:none;transition:background .15s}
.dwh:active{background:var(--surf2)}
.dwh .bi{width:32px;height:32px;border-radius:50%;background:rgba(52,112,238,.12);color:var(--p);display:grid;place-items:center;font-size:16px;flex:0 0 auto}
.dwh .tx{flex:1;min-width:0}
.dwh b{font-size:14px;font-weight:500;display:block;line-height:1.35}
.dwh span{font-size:11.5px;color:var(--mu);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dwh .cv{color:var(--mu);font-size:18px;transition:transform .25s cubic-bezier(.4,0,.2,1)}
.dw.on .dwh .cv{transform:rotate(180deg)}
.dwb{max-height:0;overflow:hidden;transition:max-height .28s cubic-bezier(.4,0,.2,1)}
.dw.on .dwb{max-height:2400px}
.dwb .in2{padding:10px 12px 12px;border-top:1px solid var(--bd)}
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.cchip{display:flex;align-items:center;gap:8px;background:var(--surf2);border-radius:2px;padding:9px 10px;cursor:pointer;font-size:12.5px;transition:background .15s}
.cchip:active{background:#E4E4E4}
.cchip .bi{width:26px;height:26px;border-radius:50%;background:#fff;color:var(--p);display:grid;place-items:center;font-size:14px;flex:0 0 auto}
.cchip b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cchip em{margin-left:auto;font-style:normal;font-size:11px;color:var(--mu);flex:0 0 auto}
.tabs{display:flex;background:var(--surf);border-radius:2px;box-shadow:var(--e1);margin-bottom:10px;overflow:hidden}
.tb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;padding:8px 4px;font-size:11px;color:var(--mu);cursor:pointer;transition:background-color .18s,color .18s}
.tb+.tb{border-left:1px solid var(--bd)}
.tb .ic{font-size:20px}
.tb span{white-space:nowrap}
.tb.on{color:var(--p);background:#E8F0FE}
.tb:active{background:var(--surf2)}
.tb:focus-visible{outline:2px solid var(--p);outline-offset:-2px}
.card{background:var(--surf);border-radius:2px;padding:14px;box-shadow:var(--e1);margin-bottom:10px}
.card h3{font-size:13px;font-weight:500;color:var(--p);letter-spacing:.4px;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.ta{width:100%;min-height:96px;padding:11px;border:1px solid var(--bd);border-radius:2px;background:var(--surf);resize:vertical;outline:0;font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.7}
.in{padding:9px 11px;border:1px solid var(--bd);border-radius:2px;background:var(--surf);outline:0;max-width:100%}
.ta:focus,.in:focus{border-color:var(--p);box-shadow:0 0 0 1px var(--p)}
select.in{cursor:pointer}
button{padding:9px 16px;border:0;border-radius:2px;background:var(--p);color:#fff;font-size:13px;font-weight:500;letter-spacing:.5px;cursor:pointer;box-shadow:var(--e1);transition:background .12s}
button:active{background:var(--p7);box-shadow:var(--e2)}
button.gh{background:var(--ghbg);color:var(--ghtx);box-shadow:none}
button.gh:active{background:#CFCFCF}
button.sm{padding:7px 12px;font-size:12.5px;letter-spacing:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.lbl{font-size:12px;color:var(--mu);margin:12px 0 6px}
.msg{font-size:12.5px;min-height:18px;margin-top:8px;color:var(--mu)}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--er)}
.out{font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.75;word-break:break-all;white-space:pre-wrap;background:var(--surf2);border:1px solid var(--bd);border-radius:2px;padding:11px;min-height:52px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:6px}
.st{background:var(--surf2);border-radius:2px;padding:10px 5px;text-align:center}
.st b{display:block;font-size:18px;color:var(--p);font-variant-numeric:tabular-nums}
.st span{font-size:10.5px;color:var(--mu)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--tx);cursor:pointer;user-select:none}
.chk input{accent-color:var(--p);width:16px;height:16px}
.frames{display:flex;gap:4px;margin-bottom:8px}
.frames button{flex:1;padding:8px 4px;font-size:12.5px;background:var(--ghbg);color:var(--ghtx);box-shadow:none;border-radius:2px;letter-spacing:0}
.frames button.on{background:var(--pb);color:#fff}
.fw{width:100%;height:calc(100vh - 220px);min-height:360px;border:1px solid var(--bd);border-radius:2px;overflow:hidden;background:#fff}
.fw iframe{width:100%;height:100%;border:0;display:block}
.disc{margin-top:8px;font-size:11.5px;color:var(--mu);text-align:center;line-height:1.6;padding:9px 10px;background:var(--surf2);border:1px solid var(--bd);border-radius:2px}
#allg{grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:479px){#allg{grid-template-columns:repeat(2,1fr);gap:9px}}
@media(max-width:339px){#allg{grid-template-columns:1fr}}
.pop{position:fixed;z-index:30;background:#fff;border-radius:2px;min-width:132px;padding:4px 0;background:var(--surf);box-shadow:0 4px 16px rgba(0,0,0,.22),0 1px 3px rgba(0,0,0,.12);animation:popin .12s ease-out}
@keyframes popin{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.pop button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;box-shadow:none;color:var(--tx);font-size:13.5px;letter-spacing:0;font-weight:400;padding:11px 14px;border-radius:0}
.pop button:active{background:var(--surf2)}
.pop button.on{color:var(--p)}
.pop button svg{font-size:15px}
.empty{text-align:center;color:var(--mu);padding:52px 20px;font-size:13px}
.empty .ic{font-size:34px;opacity:.35;display:block;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,8px);background:#323232;color:#fff;padding:10px 18px;border-radius:2px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:20;box-shadow:var(--e2)}
.toast.on{opacity:1;transform:translate(-50%,0)}
canvas{display:block;max-width:100%;touch-action:none}
.badge{position:absolute;top:6px;left:6px;font-size:9px;line-height:1;padding:3px 5px;border-radius:2px;font-weight:500;white-space:nowrap}
.badge.ok{background:#E6F4EA;color:#0F7B44}
.badge.partial{background:#FEF7E0;color:#A06300}
.badge.dead{background:#FCE8E6;color:#C5221F}
.warn{display:flex;gap:9px;align-items:flex-start;background:#FFF8E1;border:1px solid #F3E0A8;color:#7A5B12;border-radius:2px;padding:10px 12px;font-size:12.5px;line-height:1.55;margin-bottom:10px}
.warn svg{width:17px;height:17px;flex:0 0 auto;margin-top:1px}
.warn b{color:#6B4E09}
.warn code{background:#F0E4C0;padding:1px 5px;border-radius:2px;font-size:11.5px}
.frbar{display:flex;gap:8px;align-items:center;margin:-2px 0 8px}
.frbar a{flex:0 0 auto;font-size:12px;color:var(--p);text-decoration:none;border:1px solid var(--bd);background:var(--surf);padding:6px 11px;border-radius:2px}
.frbar a:active{background:#E8F0FE}
.blkopen{display:inline-block;margin-top:8px;background:var(--pb);color:#fff;text-decoration:none;font-size:12.5px;padding:8px 14px;border-radius:2px;font-weight:500}
.blkopen:active{background:var(--p7)}
.frhint{margin-left:auto;font-size:11px;color:var(--mu)}
.note{font-size:11px;color:var(--mu);margin-top:8px;line-height:1.6}
@media(min-width:900px){
 .tabs{max-width:660px}
 .tb{flex-direction:row;gap:8px;font-size:13px;min-height:50px;padding:11px 4px}
 main{padding:16px 24px 48px}
 .top{padding:0 12px 0 24px}
 .grid{grid-template-columns:repeat(6,1fr);gap:10px}
 .grid.f{grid-template-columns:repeat(6,1fr)}
 .cgrid{grid-template-columns:repeat(4,1fr)}
 .fw{height:calc(100vh - 240px)}
 .toast{bottom:28px}
}

/* 深色主题 */

[data-theme=dark] .top{box-shadow:0 1px 0 var(--bd),var(--e1)}

[data-theme=dark] .tile:active,[data-theme=dark] .dwh:active,[data-theme=dark] .cchip:active,[data-theme=dark] .pop button:active{background:#3A3D42}

[data-theme=dark] .warn b{color:#FFD98A}
[data-theme=dark] .warn code{background:#4A3A1C;color:#FFD98A}
[data-theme=dark] .badge.ok{background:#1E3A2A;color:#81C995}
[data-theme=dark] .badge.partial{background:#3E331A;color:#FDD663}
[data-theme=dark] .badge.dead{background:#4A2320;color:#F28B82}
[data-theme=dark] canvas{background:transparent}
body,.top,.card,.tile,.dw,.dwh,.tabs,.tb,.seek input,.ta,.in,.out,.st,.cchip,.pop,.pop button,.disc,.frbar a,.warn,.badge,.empty,.sec h2,.msg,.lbl{transition:background-color .25s ease,border-color .25s ease,color .25s ease,box-shadow .25s ease}
.ico-btn:focus-visible,button:focus-visible,.tile:focus-visible,.dwh:focus-visible{outline:2px solid var(--p);outline-offset:2px}
</style>

{id:'color',n:'配色助手',ic:'pal',c:'life',tp:'l',d:'取色 · 配色 · 色阶',
 h:'<div class="card"><div id="pP" style="height:88px;border-radius:12px;background:#3470EE;transition:background .3s"></div><div class="row"><input class="in" id="pH" value="#3470EE" style="width:112px;font-family:ui-monospace,monospace"><button class="gh sm" id="pC">复制</button></div><div class="row"><input class="in" id="pR" type="number" style="width:70px"><input class="in" id="pG" type="number" style="width:70px"><input class="in" id="pB" type="number" style="width:70px"><span class="lbl" style="margin:0">RGB</span></div><div class="row"><input class="in" id="p1" type="number" style="width:70px"><input class="in" id="p2" type="number" style="width:70px"><input class="in" id="p3" type="number" style="width:70px"><span class="lbl" style="margin:0">HSL</span></div><div class="lbl">色阶（点击复制）</div><div id="pS" style="display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--bd)"></div><div class="lbl">搭配方案</div><div id="pM" style="display:flex;gap:8px"></div></div><div class="card"><h3>'+ic('pal')+'图片取色</h3><input type="file" id="pF" accept="image/*" class="in" style="width:100%"><canvas id="pV" style="width:100%;height:auto;margin-top:10px;border-radius:10px;display:none"></canvas><div class="msg" id="pMsg">选择图片后点击任意位置取色</div></div>',
 k:function(){
  function h2r(h){h=h.replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];var v=parseInt(h,16);return[v>>16&255,v>>8&255,v&255]}
  function r2h(r,g,b){return '#'+[r,g,b].map(function(x){return ('0'+Math.round(x).toString(16)).slice(-2)}).join('').toUpperCase()}
  function r2l(r,g,b){r/=255;g/=255;b/=255;var mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn,h=0,s=0;
   if(d){s=d/(1-Math.abs(2*l-1));h=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4);h*=60}
   return[Math.round(h),Math.round(s*100),Math.round(l*100)]}
  function l2r(h,s,l){h=(h/60)%6;s/=100;l/=100;var c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs(h%2-1)),m=l-c/2,r,g,b;
   if(h<1){r=c;g=x;b=0}else if(h<2){r=x;g=c;b=0}else if(h<3){r=0;g=c;b=x}else if(h<4){r=0;g=x;b=c}else if(h<5){r=x;g=0;b=c}else{r=c;g=0;b=x}
   return[Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)]}
  function sync(rgb,src){
   var h=r2h(rgb[0],rgb[1],rgb[2]),l=r2l(rgb[0],rgb[1],rgb[2]);
   $('pP').style.background=h;if(src!=='h')$('pH').value=h;
   if(src!=='r'){$('pR').value=rgb[0];$('pG').value=rgb[1];$('pB').value=rgb[2]}
   if(src!=='l'){$('p1').value=l[0];$('p2').value=l[1];$('p3').value=l[2]}
   $('pS').innerHTML=[92,84,76,68,60,52,44,36,28,20].map(function(x){
    var c=r2h.apply(null,l2r(l[0],l[1],x));
    return '<div data-v="'+c+'" style="flex:1;height:38px;background:'+c+';display:grid;place-items:center;font-size:9px;color:'+(x>62?'#1C2333':'#fff')+';cursor:pointer">'+c.slice(1)+'</div>'}).join('');
   var m=[[0,'原色'],[180,'互补'],[30,'邻近'],[150,'分裂'],[120,'三角']];
   $('pM').innerHTML=m.map(function(q){
    var c=r2h.apply(null,l2r((l[0]+q[0])%360,l[1],l[2]));
    return '<div data-v="'+c+'" style="flex:1;text-align:center;cursor:pointer"><div style="height:34px;border-radius:8px;background:'+c+'"></div><div style="font-size:10px;color:var(--mu);margin-top:3px">'+q[1]+'</div></div>'}).join('');
   Array.prototype.forEach.call($('pS').children,function(d){d.onclick=function(){cp(d.dataset.v)}});
   Array.prototype.forEach.call($('pM').children,function(d){d.onclick=function(){cp(d.dataset.v)}});
  }
  $('pH').oninput=function(){var v=this.value.trim();if(/^#?[0-9a-fA-F]{6}$/.test(v)||/^#?[0-9a-fA-F]{3}$/.test(v))sync(h2r(v),'h')};
  function rr(){var a=[+$('pR').value,+$('pG').value,+$('pB').value];if(a.some(function(x){return isNaN(x)||x<0||x>255}))return;sync(a,'r')}
  function ll(){var a=[+$('p1').value,+$('p2').value,+$('p3').value];if(a.some(isNaN))return;sync(l2r(a[0],a[1],a[2]),'l')}
  $('pR').oninput=$('pG').oninput=$('pB').oninput=rr;$('p1').oninput=$('p2').oninput=$('p3').oninput=ll;
  $('pC').onclick=function(){cp($('pH').value)};
  var cv=$('pV'),cx=cv.getContext('2d');
  $('pF').onchange=function(){
   var f=this.files[0];if(!f)return;var r=new FileReader();
   r.onload=function(){var im=new Image();im.onload=function(){
    cv.width=im.width;cv.height=im.height;cv.style.display='block';cx.drawImage(im,0,0);
    $('pMsg').textContent='点击图片任意位置取色'};im.src=r.result};r.readAsDataURL(f)};
  cv.onclick=function(e){var r=cv.getBoundingClientRect(),d=cx.getImageData(Math.round((e.clientX-r.left)*cv.width/r.width),Math.round((e.clientY-r.top)*cv.height/r.height),1,1).data;
   sync([d[0],d[1],d[2]],'');$('pMsg').textContent='已取色 '+r2h(d[0],d[1],d[2])};
  sync([52,112,238],'');
 }},

 h:'<div class="card"><h3>'+ic('qr')+'生成二维码</h3><textarea class="ta" id="qI" style="min-height:80px" placeholder="输入文本或网址…"></textarea><div class="row"><span class="lbl" style="margin:0">尺寸</span><input type="range" id="qS" min="120" max="480" value="260" style="flex:1"><span class="lbl" style="margin:0">前景</span><input type="color" id="qC" value="#1C2333" style="width:44px;height:32px;padding:2px"><span class="lbl" style="margin:0">背景</span><input type="color" id="qB" value="#FFFFFF" style="width:44px;height:32px;padding:2px"></div><div class="row"><button id="qG">生成</button><button class="gh sm" id="qD">下载 PNG</button></div><div style="text-align:center;margin-top:14px"><canvas id="qV" style="margin:0 auto;display:none;image-rendering:pixelated"></canvas></div><div class="msg" id="qM"></div></div>',

    for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(m[r][c])x.fillRect((c+p)*sc,(r+p)*sc,sc,sc);
    $('qM').textContent='版本 '+(n-17)/4+' · '+n+'×'+n+' 模块';
   }catch(e){$('qM').className='msg bad';$('qM').textContent='生成失败：'+e.message}
  }
  $('qG').onclick=run;$('qS').oninput=run;$('qC').oninput=$('qB').oninput=run;
  $('qD').onclick=function(){if($('qV').style.display==='none')return toast('请先生成');dl('QR-'+Date.now()+'.png',$('qV').toDataURL('image/png'))};
 }},
{id:'cut',n:'九格切图',ic:'cut',c:'img',tp:'l',d:'本地切割，不上传服务器',
 h:'<div class="card"><h3>'+ic('cut')+'选择图片</h3><input type="file" id="cF" accept="image/*" class="in" style="width:100%"><div class="row"><span class="lbl" style="margin:0">切分</span><select class="in" id="cN"><option value="3">3 × 3（九格）</option><option value="2">2 × 2</option><option value="4">4 × 4</option></select><button class="gh sm" id="cR">重置</button></div><canvas id="cV" style="display:none"></canvas><div id="cP" style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:12px"></div><div class="row"><button id="cA" style="display:none">下载全部</button></div><div class="msg" id="cM">图片在浏览器本地处理，不会上传</div></div>',
 k:function(){
  var im=null,n=3;
  function work(){
   if(!im)return;n=+$('cN').value;

   cv.width=cv.height=side;var x=cv.getContext('2d');

   $('cP').style.gridTemplateColumns='repeat('+n+',1fr)';

    var box=document.createElement('div');box.style.cssText='position:relative;cursor:pointer';

    box.appendChild(img);box.dataset.n=(r*n+c+1);box.dataset.u=t.toDataURL('image/png');
    box.onclick=function(){dl('切图-'+this.dataset.n+'.png',this.dataset.u);toast('已保存第 '+this.dataset.n+' 张')};
    $('cP').appendChild(box);
   }
   $('cA').style.display='';$('cM').textContent='已切成 '+(n*n)+' 张，点击单张即可保存';
  }
  $('cF').onchange=function(){var f=this.files[0];if(!f)return;
   var r=new FileReader();r.onload=function(){im=new Image();im.onload=work;im.src=r.result};r.readAsDataURL(f)};
  $('cN').onchange=work;$('cR').onclick=function(){$('cP').innerHTML='';$('cA').style.display='none';im=null;$('cF').value=''};
  $('cA').onclick=function(){
   var b=$('cP').children,i=0;
   (function nx(){if(i>=b.length)return toast('已保存 '+b.length+' 张');
    dl('切图-'+b[i].dataset.n+'.png',b[i].dataset.u);i++;setTimeout(nx,260)})();
  };
 }},
{id:'app',n:'网页转应用',ic:'app',c:'net',tp:'l',d:'包名/版本/模式可配置，生成应用外壳',fr:[{n:'PWA Builder',url:'https://www.pwabuilder.com/'}],
 h:'<div class="card"><h3>'+ic('app')+'基本信息</h3>'

 k:function(){

   $('vO').textContent='包名：'+d.p+'\n版本名：'+d.vn+'（版本号 '+d.vc+'）\n模式：'+o.join(' / ')}
  function shell(d){
   var css='html,body{margin:0;height:100%;overflow:hidden;background:#fff}'
    +'#bar{position:fixed;top:0;left:0;right:0;height:'+(d.desk?38:0)+'px;display:'+(d.desk?'flex':'none')+';align-items:center;gap:8px;padding:0 10px;background:'+d.c+';color:#fff;font:13px system-ui,sans-serif;z-index:9}'

    +(d.hw?';transform:translateZ(0);will-change:transform':'')+'}'
    +'#bar button{background:rgba(255,255,255,.22);border:0;color:#fff;font-size:12px;padding:4px 10px;border-radius:2px;cursor:pointer}';
   var bar='<div id="pg"></div><div id="bar"><b>'+esc(d.n)+'</b>'

   var js='<script>'
    +(d.pro?'var p=document.getElementById("pg");function go(v){p.style.width=v+"%";setTimeout(function(){if(v<90)p.style.width=(v+8)+"%"},400)}go(12);':'var go=function(){};')
    +'var f=document.getElementById("fr");f.onload=function(){go(100);setTimeout(function(){document.getElementById("pg").style.opacity=0},400)};'
    +(d.lan?'if(screen.orientation&&screen.orientation.lock){screen.orientation.lock("landscape").catch(function(){})}':'')
    +'<\/script>';
   return '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">'
    +'<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
    +'<meta name="theme-color" content="'+d.c+'"><meta name="apple-mobile-web-app-capable" content="yes">'
    +'<meta name="application-name" content="'+esc(d.n)+'"><meta name="package" content="'+esc(d.p)+'">'

    +js+'</body></html>';
  }
  function manifest(d){
   var m={name:d.n,short_name:d.n.slice(0,12),id:d.p,version:d.vn,version_code:d.vc,start_url:d.u,scope:d.u,
    display:d.desk?'standalone':'standalone',display_override:d.desk?['window-controls-overlay','minimal-ui']:['standalone','minimal-ui'],
    orientation:d.lan?'landscape':'any',background_color:'#ffffff',theme_color:d.c,
    icons:[{src:'https://www.google.com/s2/favicons?domain='+d.u+'&sz=192',sizes:'192x192',type:'image/png',purpose:'any maskable'}]};
   return JSON.stringify(m,null,2);
  }
  function chk(d){if(!/^https?:\/\//.test(d.u)){toast('请填写完整网址');return false}return true}
  $('vH').onclick=function(){var d=g();if(!chk(d))return;summary(d);
   dl(safe(d.n)+'.html','data:text/html;charset=utf-8,'+encodeURIComponent(shell(d)));toast('已下载应用外壳');};
  $('vJ').onclick=function(){var d=g();if(!chk(d))return;summary(d);

  $('vL').onclick=function(){var d=g();if(!chk(d))return;

  ['vN','vU','vP','vR','vB','vC'].forEach(function(i){$(i).oninput=function(){summary(g())}});
  ['oDesk','oExt','oHw','oMul','oPro','oLan'].forEach(function(i){$(i).onchange=function(){summary(g())}});

 }},

{id:'tscreen',n:'时间屏幕',ic:'clock',c:'life',tp:'l',d:'全屏大字时钟',
 h:'<div class="card"><div id="tsP" style="font-family:ui-monospace,Consolas,monospace;font-size:42px;line-height:1.2;text-align:center;padding:26px 8px;border-radius:12px;background:#101420;letter-spacing:3px"><span id="tsT">--:--:--</span><div id="tsD" style="font-size:13px;color:#8f9ab3;margin-top:8px;letter-spacing:1px"></div></div><div class="row"><label class="chk"><input type="checkbox" id="tsS" checked>显示秒</label><label class="chk"><input type="checkbox" id="tsH">12 小时制</label><label class="chk">颜色<input type="color" id="tsC" value="#FFFFFF" style="width:40px;height:28px;padding:2px"></label></div><div class="row"><button id="tsF">全屏显示</button><span class="msg" style="margin:0">全屏后点击屏幕退出</span></div></div>',
 k:function(){

{id:'ruler',n:'尺子',ic:'ruler',c:'life',tp:'l',d:'屏幕刻度尺，可校准',
 h:'<div class="card"><div class="row" style="margin:0"><span class="lbl" style="margin:0">校准</span><input type="range" id="ruC" min="20" max="130" value="38" style="flex:1"><b id="ruV" style="color:var(--p);width:68px;text-align:right">38 px/cm</b></div><div style="margin-top:12px;height:74px;background:#fff;border:1px solid var(--bd);border-radius:12px;overflow:hidden;position:relative"><div id="ruH"></div></div><div style="margin-top:14px;display:flex;justify-content:center"><div style="width:74px;height:420px;background:#fff;border:1px solid var(--bd);border-radius:12px;overflow:hidden;position:relative"><div id="ruVt"></div></div></div><div class="msg">用银行卡（宽 85.6mm）比对刻度校准，1cm ≈ 38px 为多数设备默认值</div></div>',

{id:'score',n:'记分牌',ic:'score',c:'life',tp:'l',d:'多人计分，大按钮操作',
 h:'<div class="card"><div id="scL" class="g2"></div><div class="row"><button class="gh sm" id="scA">加一方</button><button class="gh sm" id="scR">全部归零</button></div></div>',
 k:function(){
  var K='amu_score',t=store(K)||[{n:'A 队',s:0},{n:'B 队',s:0}];
  function save(){store(K,t)}
  function draw(){
   $('scL').innerHTML=t.map(function(x,i){
    return '<div style="background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px;text-align:center"><input class="in" data-n="'+i+'" value="'+esc(x.n)+'" style="width:100%;text-align:center;font-size:13px;margin-bottom:8px"><div style="font-size:44px;font-weight:500;color:var(--p);font-variant-numeric:tabular-nums;line-height:1.1">'+x.s+'</div><div class="row" style="margin-top:10px;justify-content:center"><button class="sm" data-a="1" data-i="'+i+'" style="flex:1">+1</button><button class="gh sm" data-a="-1" data-i="'+i+'">-1</button><button class="gh sm" data-a="d" data-i="'+i+'">×</button></div></div>'}).join('');

 }},
{id:'timer',n:'计时器',ic:'timer',c:'life',tp:'l',d:'倒计时，结束提示音',
 h:'<div class="card"><div id="tiD" style="font-family:ui-monospace,Consolas,monospace;font-size:52px;text-align:center;padding:18px 0;color:var(--p);font-variant-numeric:tabular-nums">00:00</div><div class="row" style="margin:0"><input class="in" id="tiM" type="number" value="5" style="width:74px"><span class="lbl" style="margin:0">分</span><input class="in" id="tiS" type="number" value="0" style="width:74px"><span class="lbl" style="margin:0">秒</span></div><div class="row"><button class="gh sm" data-pre="60">1 分钟</button><button class="gh sm" data-pre="180">3 分钟</button><button class="gh sm" data-pre="300">5 分钟</button><button class="gh sm" data-pre="600">10 分钟</button></div><div class="row"><button id="tiB">开始</button><button class="gh" id="tiR">重置</button></div></div>',
 k:function(){
  var left=0,run=false;
  function show(){$('tiD').textContent=pad(Math.floor(left/60))+':'+pad(left%60)}
  function beep(){try{var c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();
   o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();
   setTimeout(function(){o.stop();c.close()},700)}catch(e){}toast('时间到')}
  function step(){if(!run)return;
   if(left<=0){run=false;$('tiB').textContent='开始';beep();return}
   left--;show()}
  $('tiB').onclick=function(){
   if(run){run=false;clearInterval(timer);this.textContent='开始';return}
   if(left<=0)left=(+$('tiM').value||0)*60+(+$('tiS').value||0);
   if(left<=0)return toast('请设置时长');
   run=true;this.textContent='暂停';show();
   clearInterval(timer);timer=setInterval(step,1000);
  };
  $('tiR').onclick=function(){run=false;clearInterval(timer);left=0;$('tiB').textContent='开始';show()};
  Array.prototype.forEach.call(MAIN.querySelectorAll('[data-pre]'),function(b){b.onclick=function(){
   left=+b.dataset.pre;$('tiM').value=Math.floor(left/60);$('tiS').value=left%60;show()}});
  show();

{id:'pomo',n:'番茄时钟',ic:'tomato',c:'life',tp:'l',d:'25 分钟专注 + 5 分钟休息',

 k:function(){
  var work=true,left=25*60,run=false,done=0;
  function show(){
   $('pmT').textContent=pad(Math.floor(left/60))+':'+pad(left%60);
   $('pmS').textContent=(work?'专注中':'休息中')+' · 第 '+(done+1)+' 个番茄';
   $('pmP').style.background=work?'':'#E8F5E9';
   $('pmM').textContent='已完成 '+done+' 个番茄';}
  function flip(){work=!work;left=(work?+$('pmW').value:+$('pmB').value)*60;if(!work)done++;show();toast(work?'开始专注':'休息一下')}

   run=true;this.textContent='暂停';clearInterval(timer);timer=setInterval(step,1000)};

  $('pmR').onclick=function(){run=false;clearInterval(timer);clearInterval(timer);work=true;done=0;left=(+$('pmW').value||25)*60;$('pmGo').textContent='开始';show()};

 }},

{id:'bmi',n:'身体质量计算器',ic:'health',c:'calc',tp:'l',d:'BMI 与健康体重区间',
 h:'<div class="card"><div class="row" style="margin:0"><span class="lbl" style="margin:0;width:58px">身高</span><input class="in" id="bmH" type="number" value="170" style="flex:1"><span class="lbl" style="margin:0">cm</span></div><div class="row"><span class="lbl" style="margin:0;width:58px">体重</span><input class="in" id="bmW" type="number" value="65" style="flex:1"><span class="lbl" style="margin:0">kg</span></div><div class="stat" style="margin-top:14px"><div class="st"><b id="bmV">0</b><span>BMI</span></div><div class="st"><b id="bmC" style="font-size:15px">—</b><span>体型</span></div><div class="st"><b id="bmL" style="font-size:14px">—</b><span>健康区间</span></div></div><div class="msg" id="bmM"></div></div>',
 k:function(){

{id:'colormap',n:'颜色码转换',ic:'pal',c:'calc',tp:'l',d:'HEX / RGB / HSL / HSV / CMYK',
 h:'<div class="card"><div id="cmP" style="height:78px;border-radius:12px;background:#3470EE;margin-bottom:12px"></div><input class="in" id="cmI" value="#3470EE" placeholder="输入 HEX / rgb() / hsl() 任意格式" style="width:100%"><div class="msg" id="cmM"></div><div id="cmO" style="margin-top:10px"></div></div>',
 k:function(){
  function h2r(h){h=h.replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];if(!/^[0-9a-f]{6}$/i.test(h))return null;var v=parseInt(h,16);return[v>>16&255,v>>8&255,v&255]}
  function r2h(r,g,b){return '#'+[r,g,b].map(function(x){return ('0'+Math.round(x).toString(16)).slice(-2)}).join('').toUpperCase()}
  function r2l(r,g,b){r/=255;g/=255;b/=255;var mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn,h=0,s=0;
   if(d){s=d/(1-Math.abs(2*l-1));h=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4);h*=60}
   return[Math.round(h),Math.round(s*100),Math.round(l*100)]}
  function r2v(r,g,b){r/=255;g/=255;b/=255;var mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
   var h=0,s=mx?d/mx:0;if(d){h=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4);h*=60}
   return[Math.round(h),Math.round(s*100),Math.round(mx*100)]}
  function r2c(r,g,b){var k=1-Math.max(r,g,b)/255;if(k===1)return[0,0,0,100];
   return[Math.round((1-r/255-k)/(1-k)*100),Math.round((1-g/255-k)/(1-k)*100),Math.round((1-b/255-k)/(1-k)*100),Math.round(k*100)]}
  function parse(s){
   s=s.trim();
   var m;
   if(m=s.match(/^#?([0-9a-f]{3}|[0-9a-f]{6})$/i))return h2r(m[1]);
   if(m=s.match(/rgba?\(\s*(\d+)\D+(\d+)\D+(\d+)/i))return[+m[1],+m[2],+m[3]];
   if(m=s.match(/hsla?\(\s*(\d+)\D+(\d+)%?\D+(\d+)%?/i)){
    var h=+m[1]/60,s=+m[2]/100,l=+m[3]/100,c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs(h%2-1)),mm=l-c/2,r=0,g=0,b=0;
    if(h<1){r=c;g=x}else if(h<2){r=x;g=c}else if(h<3){g=c;b=x}else if(h<4){g=x;b=c}else if(h<5){r=x;b=c}else{r=c;b=x}
    return[Math.round((r+mm)*255),Math.round((g+mm)*255),Math.round((b+mm)*255)]}
   return null;
  }
  function run(){
   var rgb=parse($('cmI').value);
   if(!rgb){$('cmM').className='msg bad';$('cmM').textContent='无法识别，请输入如 #3470EE / rgb(52,112,238) / hsl(221,85%,57%)';$('cmO').innerHTML='';return}
   $('cmM').className='msg ok';$('cmM').textContent='已识别';
   var h=r2h.apply(null,rgb),l=r2l.apply(null,rgb),v=r2v.apply(null,rgb),c=r2c.apply(null,rgb);
   $('cmP').style.background=h;
   var rows=[['HEX',h],['RGB','rgb('+rgb.join(', ')+')'],['HSL','hsl('+l[0]+', '+l[1]+'%, '+l[2]+'%)'],['HSV','hsv('+v[0]+', '+v[1]+'%, '+v[2]+'%)'],['CMYK','cmyk('+c.join('%, ')+'%)']];
   $('cmO').innerHTML=rows.map(function(r){
    return '<div class="card" data-v="'+esc(r[1])+'" style="padding:10px 12px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;gap:10px"><span style="font-size:11.5px;color:var(--mu)">'+r[0]+'</span><span style="font-family:ui-monospace,monospace;font-size:12.5px;color:var(--p);word-break:break-all;text-align:right">'+esc(r[1])+'</span></div>'}).join('');
   Array.prototype.forEach.call($('cmO').children,function(x){x.onclick=function(){cp(x.dataset.v)}});
  }
  $('cmI').oninput=run;run();
 }},
{id:'md5',n:'MD5摘要',ic:'hash',c:'calc',tp:'l',d:'MD5 与 SHA 系列摘要',
 h:'<div class="card"><textarea class="ta" id="mdI" style="min-height:110px" placeholder="输入文本…"></textarea><div class="row"><select class="in" id="mdA"><option>MD5</option><option>SHA-1</option><option>SHA-256</option><option>SHA-512</option></select><button id="mdB">计算</button><label class="chk"><input type="checkbox" id="mdU">大写</label><button class="gh sm" id="mdC">复制</button></div><div class="lbl">摘要</div><div class="out" id="mdO"></div></div>',

{id:'shellshot',n:'带壳截图',ic:'phone',c:'img',tp:'l',d:'给截图套手机外壳',
 h:'<div class="card"><input type="file" id="shF" accept="image/*" class="in" style="width:100%"><div class="row"><span class="lbl" style="margin:0">边框</span><input type="range" id="shP" min="8" max="80" value="28" style="flex:1"><span class="lbl" style="margin:0">圆角</span><input type="range" id="shR" min="10" max="90" value="42" style="flex:1"></div><div class="row"><label class="chk">外壳色<input type="color" id="shC" value="#1C2333" style="width:40px;height:28px;padding:2px"></label><label class="chk"><input type="checkbox" id="shN" checked>刘海</label><button id="shD">下载 PNG</button></div><div style="text-align:center;margin-top:12px"><canvas id="shV" style="display:none;margin:0 auto;max-height:460px;width:auto"></canvas></div><div class="msg" id="shM">选择一张截图开始</div></div>',
 k:function(){
  var im=null;
  function draw(){
   if(!im)return;
   var cv=$('shV'),x=cv.getContext('2d'),pd=+$('shP').value,rd=+$('shR').value;
   cv.width=im.width+pd*2;cv.height=im.height+pd*2;
   x.clearRect(0,0,cv.width,cv.height);
   x.fillStyle=$('shC').value;rr(x,0,0,cv.width,cv.height,rd);x.fill();
   x.save();rr(x,pd,pd,im.width,im.height,Math.max(4,rd-pd*0.7));x.clip();x.drawImage(im,pd,pd);x.restore();
   if($('shN').checked){var nw=Math.min(110,im.width*0.3),nh=Math.max(10,pd*0.5);
    x.fillStyle=$('shC').value;rr(x,(cv.width-nw)/2,pd,nw,nh,nh/2);x.fill()}
   cv.style.display='block';$('shM').textContent=cv.width+' × '+cv.height+' px';
  }
  $('shF').onchange=function(){var f=this.files[0];if(!f)return;
   var r=new FileReader();r.onload=function(){im=new Image();im.onload=draw;im.src=r.result};r.readAsDataURL(f)};
  $('shP').oninput=$('shR').oninput=$('shC').oninput=$('shN').onchange=draw;

{id:'exif',n:'照片信息编辑器',ic:'info',c:'img',tp:'l',d:'查看与清除照片元数据',
 h:'<div class="card"><input type="file" id="exF" accept="image/*" class="in" style="width:100%"><div class="lbl">元数据</div><div id="exO" class="out" style="min-height:80px">选择照片后显示</div><div class="row"><button class="gh sm" id="exD">导出无元数据副本</button></div><div class="msg" id="exM"></div></div>',
 k:function(){
  var im=null,buf=null;
  var M={0x010F:'厂商',0x0110:'机型',0x0131:'软件',0x0132:'修改时间',0x9003:'拍摄时间',0x0112:'方向',0x829A:'曝光时间',0x829D:'光圈',0x8827:'ISO',0x920A:'焦距',0x9209:'闪光灯',0xA002:'宽',0xA003:'高',0x010E:'描述',0x013B:'作者'};
  $('exF').onchange=function(){
   var f=this.files[0];if(!f)return;
   var r=new FileReader();
   r.onload=function(){
    buf=r.result;
    var fr=new FileReader();
    fr.onload=function(){im=new Image();im.src=fr.result};
    fr.readAsDataURL(f);
    var ex=null;
    try{ex=readExif(buf)}catch(e){}
    if(!ex){$('exO').textContent='未检测到 EXIF 信息（可能是 PNG、已压缩或元数据已被清除）';return}
    var lines=[];
    Object.keys(M).forEach(function(t){if(ex[t]!==undefined&&ex[t]!=='')lines.push(M[t]+'：'+ex[t])});
    Object.keys(ex).forEach(function(t){if(!M[t])lines.push('标签 0x'+(+t).toString(16)+'：'+ex[t])});
    $('exO').textContent=lines.join('\n')||'无可用字段';
    $('exM').textContent='文件 '+f.name+' · '+(f.size/1024).toFixed(1)+' KB';
   };
   r.readAsArrayBuffer(f);
  };
  $('exD').onclick=function(){
   if(!im)return toast('请先选择图片');
   var cv=document.createElement('canvas');cv.width=im.width;cv.height=im.height;
   cv.getContext('2d').drawImage(im,0,0);
   dl('no-exif.jpg',cv.toDataURL('image/jpeg',0.92));toast('已导出（元数据已剥离）');
  };
 }},
{id:'gif',n:'GIF合成分解',ic:'play',c:'img',tp:'l',d:'本地拆帧与合成，无需上传',fr:[{n:'iLoveIMG',url:'https://www.iloveimg.com/zh-cn'},{n:'Aconvert',url:'https://www.aconvert.com/cn/image/gif/'}],
 h:'<div class="card"><h3>'+ic('play')+'GIF 分解（拆帧）</h3>'
  +'<input type="file" id="gfF" accept="image/gif" class="in" style="width:100%">'
  +'<div class="row"><button id="gfB">拆帧</button><button class="gh sm" id="gfD" disabled>下载全部 PNG</button><span class="msg" style="margin:0" id="gfM"></span></div>'
  +'<div id="gfL" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px"></div></div>'
  +'<div class="card"><h3>'+ic('image')+'GIF 合成（图片转 GIF）</h3>'
  +'<input type="file" id="gsF" accept="image/*" multiple class="in" style="width:100%">'
  +'<div class="row"><span class="lbl" style="margin:0">间隔 ms</span><input class="in" id="gsD" type="number" value="200" style="width:86px">'
  +'<span class="lbl" style="margin:0">宽度</span><input class="in" id="gsW" type="number" value="320" style="width:86px">'
  +'<select class="in" id="gsL"><option value="0">无限循环</option><option value="1">播放 1 次</option><option value="3">播放 3 次</option></select></div>'
  +'<div class="row"><button id="gsB">合成 GIF</button><button class="gh sm" id="gsD2" disabled>下载 GIF</button><span class="msg" style="margin:0" id="gsM"></span></div>'
  +'<div style="text-align:center;margin-top:12px"><img id="gsV" style="display:none;max-width:100%;border:1px solid var(--bd);border-radius:2px"></div>'
  +'<div class="msg">本地合成使用 256 色统一调色板，适合图标/表情类图片；照片类建议用下方网页版</div></div>',
 k:function(){
  var shots=[];
  $('gfB').onclick=function(){
   var f=$('gfF').files[0];if(!f)return toast('请选择 GIF 文件');
   var r=new FileReader();
   r.onload=function(){
    try{
     var g=gifDecode(new Uint8Array(r.result));
     shots=[];$('gfL').innerHTML='';
     g.frames.forEach(function(fr,i){
      var cv=document.createElement('canvas');cv.width=g.w;cv.height=g.h;
      cv.getContext('2d').putImageData(new ImageData(fr.px,g.w,g.h),0,0);
      var u=cv.toDataURL('image/png');shots.push(u);
      var box=document.createElement('div');box.style.cssText='position:relative;cursor:pointer';
      box.innerHTML='<img src="'+u+'" style="width:100%;display:block;border-radius:2px;background:#fff">'
       +'<div style="font-size:10px;color:#fff;background:rgba(0,0,0,.55);border-radius:0 0 2px 2px;text-align:center">'+i+'</div>';
      box.onclick=function(){dl('帧'+i+'.png',u)};
      $('gfL').appendChild(box);
     });
     $('gfD').disabled=false;
     $('gfM').textContent='共 '+g.frames.length+' 帧 · '+g.w+'×'+g.h;
    }catch(e){$('gfM').className='msg bad';$('gfM').textContent='✗ '+e.message}
   };
   r.readAsArrayBuffer(f);
  };
  $('gfD').onclick=function(){var i=0;(function nx(){if(i>=shots.length)return;i++;dl('帧'+(i-1)+'.png',shots[i-1]);setTimeout(nx,220)})()};
  var gifUrl='';
  $('gsB').onclick=function(){
   var fs=Array.prototype.slice.call($('gsF').files||[]);if(fs.length<1)return toast('请至少选择 1 张图片');
   var W=Math.max(32,+$('gsW').value||320),d=Math.max(20,+$('gsD').value||200),loop=+$('gsL').value;
   var imgs=[],n=0;
   fs.forEach(function(f){
    var fr=new FileReader();
    fr.onload=function(){
     var im=new Image();
     im.onload=function(){imgs.push(im);n++;if(n===fs.length)build()};
     im.src=fr.result;
    };
    fr.readAsDataURL(f);
   });
   function build(){
    var H=Math.max(1,Math.round(imgs[0].height*W/imgs[0].width));
    var frames=imgs.map(function(im){
     var cv=document.createElement('canvas');cv.width=W;cv.height=H;
     var x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);
     var hh=Math.round(W*im.height/im.width),top=Math.max(0,Math.round((H-hh)/2));
     if(hh>H)hh=H;
     x.drawImage(im,0,top,W,hh);
     return x.getImageData(0,0,W,H).data;
    });
    try{
     var bytes=gifEncode(frames,W,H,d,loop);
     if(gifUrl)URL.revokeObjectURL(gifUrl);
     gifUrl=URL.createObjectURL(new Blob([bytes],{type:'image/gif'}));
     $('gsV').src=gifUrl;$('gsV').style.display='inline-block';$('gsD2').disabled=false;
     $('gsM').className='msg';$('gsM').textContent='已生成 '+frames.length+' 帧 · '+W+'×'+H+' · '+(bytes.length/1024).toFixed(1)+' KB';
    }catch(e){$('gsM').className='msg bad';$('gsM').textContent='✗ '+e.message}
   }
  };
  $('gsD2').onclick=function(){if(gifUrl)dl('合成.gif',gifUrl)};
  this.clear=function(){if(gifUrl)URL.revokeObjectURL(gifUrl)};
 }},
{id:'meme',n:'表情制作',ic:'smile',c:'img',tp:'l',d:'图片加文字做表情包',
 h:'<div class="card"><input type="file" id="meF" accept="image/*" class="in" style="width:100%"><div class="row" style="margin:0"><input class="in" id="meT" placeholder="上方文字" style="flex:1"><input class="in" id="meB" placeholder="下方文字" style="flex:1"></div><div class="row"><span class="lbl" style="margin:0">字号</span><input type="range" id="meS" min="14" max="80" value="34" style="flex:1"><label class="chk">文字<input type="color" id="meC" value="#FFFFFF" style="width:40px;height:28px;padding:2px"></label><label class="chk">描边<input type="color" id="meK" value="#000000" style="width:40px;height:28px;padding:2px"></label></div><div class="row"><button id="meD">下载</button><label class="chk"><input type="checkbox" id="meW">底部白条模式</label></div><div style="text-align:center;margin-top:12px"><canvas id="meV" style="display:none;margin:0 auto;max-width:100%;max-height:420px"></canvas></div></div>',
 k:function(){
  var im=null;
  function draw(){
   if(!im)return;
   var cv=$('meV'),x=cv.getContext('2d');
   cv.width=im.width;cv.height=im.height;x.drawImage(im,0,0);
   var fs=+$('meS').value;
   x.font='bold '+fs+'px Impact,"Arial Black",sans-serif';
   x.textAlign='center';x.lineJoin='round';
   function put(t,y,y2){
    if(!t)return;
    if($('meW').checked){
     var w=x.measureText(t).width*1.1,h=fs*1.5,top=$('meB').value||!$('meT').value?cv.height-h:0;
     x.fillStyle='#fff';x.fillRect(0,top,cv.width,h);
     x.fillStyle='#111';x.textBaseline='middle';x.fillText(t,cv.width/2,top+h/2);
    }else{
     x.textBaseline=y2?'bottom':'top';
     x.lineWidth=Math.max(2,fs*0.16);x.strokeStyle=$('meK').value;x.strokeText(t,cv.width/2,y);
     x.fillStyle=$('meC').value;x.fillText(t,cv.width/2,y);
    }
   }
   if($('meW').checked){
    x.font='bold '+fs+'px system-ui,sans-serif';
    put($('meB').value||$('meT').value);
   }else{
    put($('meT').value,fs*1.05,false);
    put($('meB').value,cv.height-fs*0.35,true);
   }
   cv.style.display='block';
  }
  $('meF').onchange=function(){var f=this.files[0];if(!f)return;
   var r=new FileReader();r.onload=function(){im=new Image();im.onload=draw;im.src=r.result};r.readAsDataURL(f)};
  ['meT','meB','meS','meC','meK'].forEach(function(i){$(i).oninput=draw});
  $('meW').onchange=draw;
  $('meD').onclick=function(){if(!im)return toast('请先选择图片');dl('表情.png',$('meV').toDataURL('image/png'))};
 }},
{id:'photocount',n:'拍照计数',ic:'cam',c:'img',tp:'l',d:'摄像头点拍累计计数',
 h:'<div class="card"><div style="font-size:40px;text-align:center;color:var(--p);font-variant-numeric:tabular-nums;font-weight:500" id="pcN">0</div><div class="row" style="justify-content:center"><button id="pcGo">开启摄像头</button><button id="pcS" disabled>拍一张</button><button class="gh" id="pcR">清零</button></div><div id="pcV" style="margin-top:12px;text-align:center"><video id="pcC" autoplay playsinline muted style="width:100%;max-width:420px;border-radius:12px;background:#000;display:none"></video></div><div id="pcL" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px"></div><div class="msg" id="pcM">需在 https 或本地环境下使用摄像头</div></div>',
 k:function(){
  var n=0,stream=null,shots=[];
  $('pcGo').onclick=function(){
   if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null;$('pcC').style.display='none';this.textContent='开启摄像头';$('pcS').disabled=true;return}
   if(!navigator.mediaDevices)return toast('当前环境不支持摄像头');
   navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(function(s){
    stream=s;$('pcC').srcObject=s;$('pcC').style.display='block';$('pcS').disabled=false;$('pcGo').textContent='关闭摄像头';$('pcM').textContent='摄像头已开启';
   },function(e){$('pcM').textContent='无法访问摄像头：'+e.message});

  $('pcS').onclick=function(){
   if(!stream)return;
   var v=$('pcC'),cv=document.createElement('canvas');cv.width=v.videoWidth;cv.height=v.videoHeight;
   cv.getContext('2d').drawImage(v,0,0);
   n++;$('pcN').textContent=n;
   shots.unshift(cv.toDataURL('image/jpeg',0.7).replace(/^data:image\/jpeg;base64,/,'data:image/jpeg;base64,'));
   shots=shots.slice(0,6);
   $('pcL').innerHTML=shots.map(function(u,i){return '<img src="'+u+'" data-u="'+i+'" style="width:60px;height:60px;object-fit:cover;border-radius:8px;cursor:pointer">'}).join('');
   Array.prototype.forEach.call($('pcL').children,function(g){g.onclick=function(){dl('拍照-'+Date.now()+'.jpg',g.src)}});
  };
  $('pcR').onclick=function(){n=0;$('pcN').textContent=0;shots=[];$('pcL').innerHTML=''};

 }},
{id:'imgedit',n:'简易图片编辑',ic:'slid',c:'img',tp:'l',d:'旋转裁剪与滤镜调整',
 h:'<div class="card"><input type="file" id="ieF" accept="image/*" class="in" style="width:100%"><div class="row"><span class="lbl" style="margin:0">亮度</span><input type="range" id="ie1" min="0" max="200" value="100" style="flex:1"></div><div class="row"><span class="lbl" style="margin:0">对比</span><input type="range" id="ie2" min="0" max="200" value="100" style="flex:1"></div><div class="row"><span class="lbl" style="margin:0">饱和</span><input type="range" id="ie3" min="0" max="200" value="100" style="flex:1"></div><div class="row"><span class="lbl" style="margin:0">模糊</span><input type="range" id="ie4" min="0" max="20" value="0" style="flex:1"></div><div class="row"><button class="gh sm" id="ieR">右转 90°</button><button class="gh sm" id="ieL">左转 90°</button><button class="gh sm" id="ieFx">水平翻转</button><button class="gh sm" id="ieFy">垂直翻转</button><button class="gh sm" id="ieG">灰度</button><button class="gh sm" id="ieRe">重置</button></div><div class="row"><button id="ieD">下载 JPEG</button></div><div style="text-align:center;margin-top:12px"><canvas id="ieV" style="display:none;margin:0 auto;max-width:100%;max-height:420px"></canvas></div></div>',
 k:function(){
  var im=null,rot=0,fx=1,fy=1,gray=0;
  function draw(){
   if(!im)return;
   var cv=$('ieV'),x=cv.getContext('2d'),sw=im.width,sh=im.height;
   var flip=rot%180!==0;
   cv.width=flip?sh:sw;cv.height=flip?sw:sh;
   x.save();x.translate(cv.width/2,cv.height/2);x.rotate(rot*Math.PI/180);x.scale(fx,fy);
   var f='brightness('+$('ie1').value+'%) contrast('+$('ie2').value+'%) saturate('+$('ie3').value+'%)'+(+$('ie4').value?' blur('+$('ie4').value+'px)':'')+(gray?' grayscale(100%)':'');
   try{x.filter=f}catch(e){}
   x.drawImage(im,-sw/2,-sh/2);x.restore();
   cv.style.display='block';
  }
  $('ieF').onchange=function(){var f=this.files[0];if(!f)return;
   var r=new FileReader();r.onload=function(){im=new Image();im.onload=function(){rot=0;fx=fy=1;gray=0;draw()};im.src=r.result};r.readAsDataURL(f)};
  ['ie1','ie2','ie3','ie4'].forEach(function(i){$(i).oninput=draw});
  $('ieR').onclick=function(){rot=(rot+90)%360;draw()};
  $('ieL').onclick=function(){rot=(rot+270)%360;draw()};
  $('ieFx').onclick=function(){fx=-fx;draw()};
  $('ieFy').onclick=function(){fy=-fy;draw()};
  $('ieG').onclick=function(){gray=gray?0:1;draw()};
  $('ieRe').onclick=function(){rot=0;fx=fy=1;gray=0;['ie1','ie2','ie3'].forEach(function(i){$(i).value=100});$('ie4').value=0;draw()};
  $('ieD').onclick=function(){if(!im)return toast('请先选择图片');dl('编辑-'+Date.now()+'.jpg',$('ieV').toDataURL('image/jpeg',0.92))};
 }},
{id:'img2link',n:'图片转链接',ic:'up',c:'img',tp:'l',d:'本地生成链接与代码 + 网页图床',fr:[{n:'Images.now',url:'https://images.now/'},{n:'Postimages',url:'https://postimages.org/'},{n:'FreeImage',url:'https://freeimage.host/'}],
 h:'<div class="card"><h3>'+ic('up')+'本地生成（不上传服务器）</h3>'
  +'<input type="file" id="ilF" accept="image/*" class="in" style="width:100%">'
  +'<div class="row"><span class="lbl" style="margin:0">最大宽</span><input class="in" id="ilW" type="number" value="1080" style="width:92px">'
  +'<span class="lbl" style="margin:0">质量</span><input type="range" id="ilQ" min="30" max="100" value="80" style="flex:1">'
  +'<select class="in" id="ilT"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></div>'
  +'<div class="row"><button id="ilB">生成</button><button class="gh sm" id="ilP">复制图片</button><button class="gh sm" id="ilC">复制 Base64</button></div>'
  +'<div class="msg" id="ilM">选择图片后点击生成</div>'
  +'<div style="text-align:center;margin-top:10px"><img id="ilV" style="display:none;max-width:100%;max-height:240px;border:1px solid var(--bd);border-radius:2px"></div></div>'
  +'<div class="card"><h3>'+ic('code')+'可复制的代码</h3><div id="ilO"></div>'
  +'<div class="msg">本地链接为浏览器会话内临时地址，关闭后失效；需要长期外链请用下方网页版图床。</div></div>',
 k:function(){
  var url='',b64='';
  $('ilB').onclick=function(){
   var f=$('ilF').files[0];if(!f)return toast('请选择图片');
   var fr=new FileReader();
   fr.onload=function(){var im=new Image();
    im.onload=function(){
     var W=Math.max(64,+$('ilW').value||1080),q=+$('ilQ').value/100,type=$('ilT').value;
     var w=Math.min(W,im.width),h=Math.round(im.height*w/im.width);
     var cv=document.createElement('canvas');cv.width=w;cv.height=h;
     cv.getContext('2d').drawImage(im,0,0,w,h);
     url=cv.toDataURL(type,q);
     b64=url.split(',')[1];
     if(window.__ilUrl)URL.revokeObjectURL(window.__ilUrl);
     cv.toBlob(function(bl){window.__ilUrl=URL.createObjectURL(bl);paint(window.__ilUrl);} ,type,q);
     $('ilV').src=url;$('ilV').style.display='inline-block';
     $('ilM').textContent='已生成 '+w+'×'+h+' · '+(b64.length*0.75/1024).toFixed(1)+' KB';
     paint(url);
    };
    im.src=fr.result;};
   fr.readAsDataURL(f);
  };
  function paint(u){
   var rows=[['本地链接（临时）',u],['Markdown','![]('+u+')'],['HTML','<img src="'+u+'" alt="">'],['Base64 前缀','data:'+$('ilT').value+';base64,'+b64.slice(0,40)+'…']];
   $('ilO').innerHTML=rows.map(function(r){return '<div class="card" data-v="'+esc(r[1])+'" style="padding:10px 12px;margin-bottom:8px;cursor:pointer"><div style="font-size:11.5px;color:var(--mu);margin-bottom:4px">'+esc(r[0])+'</div><div style="font-family:ui-monospace,monospace;font-size:12px;color:var(--p);word-break:break-all">'+esc(r[1]).slice(0,180)+'</div></div>'}).join('');
   Array.prototype.forEach.call($('ilO').children,function(c){c.onclick=function(){cp(c.dataset.v)}});
  }
  $('ilP').onclick=function(){
   if(!url)return toast('请先生成');
   var cv=document.createElement('canvas'),im=$('ilV');
   cv.width=im.naturalWidth;cv.height=im.naturalHeight;cv.getContext('2d').drawImage(im,0,0);
   cv.toBlob(function(b){try{navigator.clipboard.write([new ClipboardItem({'image/png':b})]);toast('图片已复制')}catch(e){toast('当前浏览器不支持复制图片')}},'image/png');
  };
  $('ilC').onclick=function(){if(!b64)return toast('请先生成');cp(b64)};
  this.clear=function(){if(window.__ilUrl)URL.revokeObjectURL(window.__ilUrl)};
 }},
{id:'text2img',n:'文字转图',ic:'type',c:'img',tp:'l',d:'文字排版导出为图片',
 h:'<div class="card"><textarea class="ta" id="t2T" style="min-height:100px" placeholder="输入要转成图片的文字…">清风Studio-kit</textarea><div class="row"><span class="lbl" style="margin:0">字号</span><input type="range" id="t2S" min="14" max="72" value="30" style="flex:1"><span class="lbl" style="margin:0">行距</span><input type="range" id="t2L" min="12" max="24" value="17" style="flex:1"></div><div class="row"><span class="lbl" style="margin:0">宽度</span><input class="in" id="t2W" type="number" value="720" style="width:90px"><span class="lbl" style="margin:0">内边距</span><input class="in" id="t2P" type="number" value="40" style="width:80px"><span class="lbl" style="margin:0">圆角</span><input class="in" id="t2R" type="number" value="16" style="width:80px"></div><div class="row"><label class="chk">文字<input type="color" id="t2C" value="#1C2333" style="width:40px;height:28px;padding:2px"></label><label class="chk">背景<input type="color" id="t2B" value="#FFFFFF" style="width:40px;height:28px;padding:2px"></label><select class="in" id="t2A"><option value="left">左对齐</option><option value="center">居中</option><option value="right">右对齐</option></select></div><div class="row"><button id="t2D">下载 PNG</button></div><div style="text-align:center;margin-top:12px"><canvas id="t2V" style="max-width:100%;border:1px solid var(--bd);border-radius:12px"></canvas></div></div>',
 k:function(){
  function draw(){
   var cv=$('t2V'),x=cv.getContext('2d'),fs=+$('t2S').value,lh=fs*+$('t2L').value/10,pd=+$('t2P').value,W=Math.max(120,+$('t2W').value||720),rd=+$('t2R').value;
   var lines=[],para=$('t2T').value.split('\n');
   x.font=fs+'px system-ui,"PingFang SC","Microsoft YaHei",sans-serif';
   var maxW=W-pd*2;
   para.forEach(function(p){
    if(!p){lines.push('');return}
    var cur='';
    for(var i=0;i<p.length;i++){var t=cur+p[i];
     if(x.measureText(t).width>maxW&&cur){lines.push(cur);cur=p[i]}else cur=t}
    lines.push(cur);
   });
   cv.width=W;cv.height=Math.max(60,lines.length*lh+pd*2);
   x.fillStyle=$('t2B').value;rr(x,0,0,cv.width,cv.height,rd);x.fill();
   x.font=fs+'px system-ui,"PingFang SC","Microsoft YaHei",sans-serif';
   x.fillStyle=$('t2C').value;x.textBaseline='top';
   var al=$('t2A').value;x.textAlign=al;
   var ax=al==='left'?pd:al==='center'?cv.width/2:cv.width-pd;
   lines.forEach(function(l,i){x.fillText(l,ax,pd+i*lh)});
  }
  ['t2T','t2S','t2L','t2W','t2P','t2R','t2C','t2B','t2A'].forEach(function(i){$(i).oninput=draw});
  $('t2D').onclick=function(){dl('文字图-'+Date.now()+'.png',$('t2V').toDataURL('image/png'))};
  draw();
 }},
{id:'img2ascii',n:'图片文字化',ic:'list',c:'img',tp:'l',d:'图片转字符画，可复制',
 h:'<div class="card"><input type="file" id="iaF" accept="image/*" class="in" style="width:100%"><div class="row"><span class="lbl" style="margin:0">宽度</span><input type="range" id="iaW" min="40" max="220" value="110" style="flex:1"><select class="in" id="iaS"><option value="0">标准字符集</option><option value="1">简洁字符集</option><option value="2">方块字符集</option></select></div><div class="row"><button class="gh sm" id="iaC">复制</button><button class="gh sm" id="iaD">下载 TXT</button></div><div class="out" id="iaO" style="font-size:8px;line-height:1;white-space:pre;overflow:auto;max-height:460px;min-height:60px">选择图片后生成</div></div>',
 k:function(){
  var im=null;
  var SET=['@%#*+=-:. ',' .:-=+*#%@','█▓▒░ '];
  function run(){
   if(!im)return;
   var cs=SET[+$('iaS').value],w=+$('iaW').value;
   var cv=document.createElement('canvas'),h=Math.max(1,Math.round(w*im.height/im.width*0.5));
   cv.width=w;cv.height=h;
   var x=cv.getContext('2d');x.drawImage(im,0,0,w,h);
   var d=x.getImageData(0,0,w,h).data,out='';
   for(var y=0;y<h;y++){var line='';
    for(var xx=0;xx<w;xx++){var i=(y*w+xx)*4,g=(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114)/255;
     line+=cs[Math.min(cs.length-1,Math.round((1-g)*(cs.length-1)))]}
    out+=line+'\n'}
   $('iaO').textContent=out;
  }
  $('iaF').onchange=function(){var f=this.files[0];if(!f)return;
   var r=new FileReader();r.onload=function(){im=new Image();im.onload=run;im.src=r.result};r.readAsDataURL(f)};
  $('iaW').oninput=$('iaS').onchange=run;
  $('iaC').onclick=function(){cp($('iaO').textContent)};
  $('iaD').onclick=function(){dl('字符画.txt','data:text/plain;charset=utf-8,'+encodeURIComponent($('iaO').textContent))};
 }},
{id:'img2b64',n:'图片转Base64',ic:'code',c:'img',tp:'l',d:'图片编码为文本',

{id:'ocr',n:'OCR图片文字识别',ic:'scan',c:'txt',tp:'l',d:'本地识别（需浏览器支持）+ 网页版',fr:[{n:'白描网页版',url:'https://web.baimiaoapp.com/'},{n:'在线OCR',url:'https://ocr.wdku.net/'}],
 h:'<div class="card"><h3>'+ic('scan')+'本地文字识别</h3>'

  +'<div style="text-align:center;margin-top:10px"><img id="ocV" style="display:none;max-width:100%;max-height:300px;border:1px solid var(--bd);border-radius:2px"></div>'
  +'<div class="row"><button id="ocB">开始识别</button><button class="gh sm" id="ocC">复制结果</button><button class="gh sm" id="ocX">清空</button></div>'

  +'<div class="msg" id="ocM">本地识别调用浏览器内置 TextDetector；若提示不支持，请使用下方网页版。</div></div>',
 k:function(){
  var bmp=null;
  $('ocF').onchange=function(){var f=this.files[0];if(!f)return;
   var r=new FileReader();r.onload=function(){bmp=null;$('ocV').src=r.result;$('ocV').style.display='inline-block';$('ocO').textContent='';};
   r.readAsDataURL(f);};
  $('ocB').onclick=function(){
   if(!$('ocV').src)return toast('请先选择图片');
   if(!('TextDetector' in window)){
    $('ocM').className='msg bad';
    $('ocM').textContent='当前浏览器不支持本地 OCR（TextDetector）。可用 Chrome/Edge 新版本，或直接使用下方网页版。';
    return;}
   var img=$('ocV');
   var p=(bmp!==null&&createImageBitmap)?null:null;
   var task=createImageBitmap?createImageBitmap(img):Promise.reject(new Error('no createImageBitmap'));
   task.then(function(b){
    var det=new TextDetector();
    return det.detect(b).then(function(blocks){
     var t=blocks.map(function(x){return x.rawValue}).join('\n');
     $('ocO').textContent=t||'未识别到文字';
     $('ocM').className='msg';$('ocM').textContent='识别完成，共 '+blocks.length+' 个文本块';
    });
   }).catch(function(e){
    $('ocM').className='msg bad';$('ocM').textContent='本地识别失败：'+e.message+'，请改用下方网页版';
   });
  };
  $('ocC').onclick=function(){cp($('ocO').textContent)};
  $('ocX').onclick=function(){$('ocO').textContent='';$('ocV').style.display='none';$('ocV').removeAttribute('src');};
 }},
{id:'acrostic',n:'藏头诗生成',ic:'pen',c:'txt',tp:'l',d:'按输入的头部字成诗',
 h:'<div class="card"><div class="row" style="margin:0"><input class="in" id="acI" placeholder="输入 2-8 个字，如 清风明月" style="flex:1"><button id="acB">生成</button></div><div class="row"><select class="in" id="acS"><option value="5">五言</option><option value="7" selected>七言</option></select><button class="gh sm" id="acC">复制</button></div><div class="out" id="acO" style="min-height:110px;font-size:15px;line-height:2.1;text-align:center"></div><div class="msg">基于内置词库组合生成，仅供娱乐</div></div>',
 k:function(){
  var T={5:['{c}风拂柳千丝软','{c}水东流不复回','{c}云深处有人家','{c}山依旧枕寒流','{c}月清辉照客衣','{c}花落尽又逢君','{c}竹摇窗夜色新','{c}雪初晴万木春','{c}露微凉浸薄衫','{c}烟初起掩柴扉','{c}鸟归林暮色催','{c}霜满地月如钩'],

{id:'couplet',n:'对联生成',ic:'text',c:'txt',tp:'l',d:'上联对下联',
 h:'<div class="card"><div class="row" style="margin:0"><input class="in" id="cpI" placeholder="输入上联，如 春回大地" style="flex:1"><button id="cpB">对下联</button></div><div class="row"><button class="gh sm" id="cpR">随机来一副</button><button class="gh sm" id="cpC">复制</button></div><div class="out" id="cpO" style="min-height:100px;font-size:15px;line-height:2.1;text-align:center">等待输入</div><div class="msg">匹配内置对联库（'+0+'副），未命中时按字数结构生成</div></div>',
 k:function(){
  var L=[
   ['春回大地','福满人间'],['一元复始','万象更新'],['江山如画','岁月更新'],['五谷丰登','六畜兴旺'],
   ['天增岁月人增寿','春满乾坤福满门'],['爆竹声中一岁除','春风送暖入屠苏'],
   ['福如东海长流水','寿比南山不老松'],['门迎百福福星照','户纳千祥祥云腾'],
   ['家和万事兴','国泰百业旺'],['春满人间','福临小院'],['江山千古秀','祖国万年春'],
   ['日出江花红胜火','春来江水绿如蓝'],['海内存知己','天涯若比邻'],
   ['书山有路勤为径','学海无涯苦作舟'],['宝剑锋从磨砺出','梅花香自苦寒来'],
   ['长风破浪会有时','直挂云帆济沧海'],['春风得意马蹄疾','一日看尽长安花'],
   ['两岸猿声啼不住','轻舟已过万重山'],['会当凌绝顶','一览众山小'],
   ['欲穷千里目','更上一层楼'],['问渠那得清如许','为有源头活水来'],
   ['千山鸟飞绝','万径人踪灭'],['海阔凭鱼跃','天高任鸟飞'],
   ['明月松间照','清泉石上流'],['大漠孤烟直','长河落日圆'],
   ['业精于勤荒于嬉','行成于思毁于随'],['万事如意','心想事成'],
   ['春安夏泰','秋吉冬祥'],['花开富贵','竹报平安'],['五福临门','六六大顺'],
   ['生意兴隆通四海','财源茂盛达三江'],['喜居宝地千年旺','福照家门万事兴'],
   ['接天莲叶无穷碧','映日荷花别样红'],['春色满园关不住','一枝红杏出墙来'],
   ['家和日子旺','人和事业兴'],['岁月不居','时节如流'],['天时地利人和','福寿康宁德厚']
  ];
  var map={};L.forEach(function(p){map[p[0]]=p[1]});
  var n=0;
  function gen(s){
   if(map[s])return map[s];
   var same=L.filter(function(p){return p[0].length===s.length});
   if(!same.length)return '';
   var key=s.replace(/[^\u4e00-\u9fa5]/g,'');
   var best=same[0];
   for(var i=0;i<same.length;i++){
    var o=same[i][0],hits=0;
    for(var j=0;j<Math.min(o.length,key.length);j++)if(o[j]===key[j])hits++;
    if(hits>0){best=same[i];break}
   }
   return best[1];
  }
  function show(s){
   n=L.length;
   if(!s)return $('cpO').textContent='请输入上联';
   var t=gen(s);
   if(!t){$('cpO').textContent=s+'\n（暂无同字数下联，换一副试试）';return}
   $('cpO').textContent='上联：'+s+'\n下联：'+t;
  }
  $('cpB').onclick=function(){show($('cpI').value.trim())};
  $('cpR').onclick=function(){var p=L[Math.floor(Math.random()*L.length)];$('cpI').value=p[0];show(p[0])};
  $('cpC').onclick=function(){cp($('cpO').textContent)};
  $('cpI').onkeydown=function(e){if(e.key==='Enter')show(this.value.trim())};
  $('cpO').textContent='等待输入';
 }},
{id:'tts',n:'文字转语音',ic:'speak',c:'txt',tp:'l',d:'本地语音合成朗读',
 h:'<div class="card"><textarea class="ta" id="tvT" style="min-height:110px" placeholder="输入要朗读的文字…">你好，这里是清风 Studio-kit。</textarea><div class="row"><select class="in" id="tvV" style="flex:1;min-width:150px"></select></div><div class="row"><span class="lbl" style="margin:0">语速</span><input type="range" id="tvR" min="5" max="30" value="10" style="flex:1"><span class="lbl" style="margin:0">音调</span><input type="range" id="tvP" min="5" max="20" value="10" style="flex:1"></div><div class="row"><button id="tvS">朗读</button><button class="gh" id="tvA">暂停/继续</button><button class="gh" id="tvX">停止</button></div><div class="msg" id="tvM"></div></div>',
 k:function(){
  if(!('speechSynthesis' in window)){$('tvM').textContent='当前浏览器不支持语音合成';return}
  function load(){
   var vs=speechSynthesis.getVoices();
   $('tvV').innerHTML=vs.map(function(v,i){return '<option value="'+i+'">'+v.name+' ('+v.lang+')</option>'}).join('')||'<option>默认语音</option>';
   var zi=vs.findIndex(function(v){return /zh/i.test(v.lang)});
   if(zi>=0)$('tvV').value=zi;
  }
  load();speechSynthesis.onvoiceschanged=load;
  $('tvS').onclick=function(){
   var t=$('tvT').value.trim();if(!t)return toast('请输入文字');
   speechSynthesis.cancel();

   u.rate=+$('tvR').value/10;u.pitch=+$('tvP').value/10;
   u.onstart=function(){$('tvM').textContent='朗读中…'};

   speechSynthesis.speak(u);
  };
  $('tvA').onclick=function(){if(speechSynthesis.paused)speechSynthesis.resume();else speechSynthesis.pause()};

 }},
{id:'summary',n:'文章摘要生成',ic:'list',c:'txt',tp:'l',d:'抽取式摘要与关键词',
 h:'<div class="card"><textarea class="ta" id="smI" style="min-height:150px" placeholder="粘贴文章内容…"></textarea><div class="row"><span class="lbl" style="margin:0">摘要句数</span><input type="range" id="smN" min="1" max="8" value="3" style="flex:1"><span id="smV" style="color:var(--p);width:20px">3</span><button id="smB">生成</button><button class="gh sm" id="smC">复制摘要</button></div><div class="lbl">摘要</div><div class="out" id="smO" style="min-height:70px"></div><div class="lbl">关键词</div><div id="smK" class="row" style="margin-top:0"></div></div>',
 k:function(){
  var STOP='的 了 和 是 在 我 有 就 不 人 都 一 一个 上 也 很 到 说 要 去 你 会 着 没有 看 好 自己 这 那 与 及 或 而 但 被 把 让 从 对 为 以 之 其 于 中 后 里 就是 可以 我们 他们 这个 那个 因为 所以 如果 已经 还是 一些 什么 这样 那样'.split(' ');
  $('smN').oninput=function(){$('smV').textContent=this.value};
  $('smB').onclick=function(){
   var t=$('smI').value.trim();
   if(!t)return toast('请输入内容');
   var sents=t.split(/[。！？!?\n]+/).map(function(s){return s.trim()}).filter(function(s){return s.length>4});
   if(sents.length<2){$('smO').textContent=t;$('smK').innerHTML='';return}
   var freq={};
   sents.forEach(function(s){
    var ws=s.match(/[\u4e00-\u9fa5]{2,4}|[A-Za-z]{3,}/g)||[];
    ws.forEach(function(w){if(STOP.indexOf(w)<0)freq[w]=(freq[w]||0)+1});
   });
   var ks=t.replace(/[^\u4e00-\u9fa5A-Za-z]/g,''),kc={},n2,i2;
   for(n2=2;n2<=4;n2++)for(i2=0;i2+n2<=ks.length;i2++){var w2=ks.substr(i2,n2);kc[w2]=(kc[w2]||0)+1}
   var keys=Object.keys(kc).filter(function(w){return kc[w]>1}).sort(function(a,b){return kc[b]*b.length-kc[a]*a.length});
   if(!keys.length)keys=Object.keys(freq).sort(function(a,b){return freq[b]-freq[a]});
   var kk=[];
   keys.forEach(function(w){if(kk.length>=12)return;
    for(var q=0;q<kk.length;q++)if(kk[q].indexOf(w)>=0||w.indexOf(kk[q])>=0)return;
    kk.push(w)});
   keys=kk;
   var scored=sents.map(function(s,i){
    var ws=s.match(/[\u4e00-\u9fa5]{2,4}|[A-Za-z]{3,}/g)||[],sc=0;
    ws.forEach(function(w){sc+=freq[w]||0});
    return {i:i,s:s,sc:sc/(ws.length||1)*(1+Math.max(0,0.3-i*0.02))};
   }).sort(function(a,b){return b.sc-a.sc});
   var pick=scored.slice(0,+$('smN').value).sort(function(a,b){return a.i-b.i});
   $('smO').textContent=pick.map(function(x){return x.s}).join('。')+'。';
   $('smK').innerHTML=keys.map(function(k){return '<span style="background:#EEF3FE;color:var(--p);font-size:12px;padding:3px 9px;border-radius:8px">'+esc(k)+'</span>'}).join('');
  };

 }},

{id:'num2cn',n:'数字转中文',ic:'num',c:'txt',tp:'l',d:'小写、大写金额与逐位读法',
 h:'<div class="card"><div class="row" style="margin:0"><input class="in" id="nzI" value="1234567.89" style="flex:1"><select class="in" id="nzM"><option value="0">中文小写</option><option value="1">人民币大写</option><option value="2">逐位读</option><option value="3">英文读法</option></select><button id="nzB">转换</button></div><div class="out" id="nzO" style="margin-top:12px;min-height:60px;font-size:15px"></div><div class="row"><button class="gh sm" id="nzC">复制</button></div></div>',
 k:function(){
  var D='零一二三四五六七八九',X='零壹贰叁肆伍陆柒捌玖',U=['','十','百','千'],BIGU=['','拾','佰','仟'],BU=['','万','亿','万亿'];
  function cn(s,big){
   var neg=s[0]==='-';if(neg)s=s.slice(1);
   var p=s.split('.'),ip=(p[0]||'0').replace(/\D/g,'')||'0',fp=(p[1]||'').replace(/\D/g,'').slice(0,big?2:8);
   var d=big?X:D,U2=big?BIGU:U,g=[],i;
   for(i=ip.length;i>0;i-=4)g.unshift(ip.slice(Math.max(0,i-4),i));
   function sec(str){var o='',z=0;
    for(var k=0;k<str.length;k++){
     var n=+str[k],p2=str.length-1-k;
     if(n===0){z=1}
     else{if(z&&o)o+=d[0];z=0;o+=d[n]+(p2?U2[p2]:'')}
    }
    return o}
   var o='';
   for(i=0;i<g.length;i++){
    if(+g[i]===0){if(o)o+=d[0];continue}
    if(o&&g[i][0]==='0')o+=d[0];
    o+=sec(g[i])+BU[g.length-1-i];
   }
   o=o.replace(/零{2,}/g,'零').replace(/零+$/,'')||d[0];
   if(!big){
    o=o.replace(/^一十/,'十');
    if(fp)o+='点'+fp.split('').map(function(c){return d[+c]}).join('');
    return (neg?'负':'')+o;
   }
   var r;
   if(!fp)r=o+'元整';
   else{
    var j=+fp[0],f=+fp[1]||0;
    if(!j&&!f)r=o+'元整';
    else{r=o+'元'+(j?X[j]+'角':'零')+(f?X[f]+'分':'整')}
   }
   return (neg?'负':'')+r;
  }
  function each(s){return s.replace(/[^0-9.]/g,'').split('').map(function(c){return c==='.'?'点':D[+c]}).join('')}
  function en(s){
   var n=+s;if(isNaN(n))return '—';
   if(n>=1e12)return (n/1e12).toFixed(4)+' trillion';
   if(n>=1e9)return (n/1e9).toFixed(4)+' billion';
   if(n>=1e6)return (n/1e6).toFixed(4)+' million';
   return n.toLocaleString('en-US');
  }
  function run(){
   var v=$('nzI').value.trim();
   if(!v)return $('nzO').textContent='';
   var m=+$('nzM').value;
   $('nzO').textContent=m===0?cn(v,false):m===1?cn(v,true):m===2?each(v):en(v);
  }
  $('nzB').onclick=run;$('nzI').onkeydown=function(e){if(e.key==='Enter')run()};
  $('nzC').onclick=function(){cp($('nzO').textContent)};
  run();
 }},

{id:'b64',n:'Base64编码转换',ic:'code',c:'txt',tp:'l',d:'文本与文件编解码',
 h:'<div class="card"><textarea class="ta" id="baI" style="min-height:110px" placeholder="输入文本，或选择文件…"></textarea><div class="row"><input type="file" id="baF" class="in" style="flex:1"><button id="baE">编码</button><button class="gh" id="baD">解码</button><button class="gh sm" id="baC">复制</button></div><div class="msg" id="baM"></div><div class="out" id="baO" style="max-height:300px;min-height:60px"></div></div>',
 k:function(){

{id:'rc4',n:'RC4加解密',ic:'lock',c:'txt',tp:'l',d:'对称流密码，密钥加解密',
 h:'<div class="card"><div class="row" style="margin:0"><input class="in" id="rcK" placeholder="密钥" style="flex:1"><select class="in" id="rcF"><option value="0">输出 HEX</option><option value="1">输出 Base64</option></select></div><textarea class="ta" id="rcI" style="min-height:100px;margin-top:10px" placeholder="输入明文或密文…"></textarea><div class="row"><button id="rcE">加密</button><button class="gh" id="rcD">解密</button><button class="gh sm" id="rcC">复制</button></div><div class="out" id="rcO" style="margin-top:10px;min-height:56px"></div></div>',
 k:function(){
  function rc4(key,bytes){
   var S=[],i,j=0,o=new Uint8Array(bytes.length);
   for(i=0;i<256;i++)S[i]=i;
   var kb=new TextEncoder().encode(key);
   for(i=0;i<256;i++){j=(j+S[i]+kb[i%kb.length])&255;var t=S[i];S[i]=S[j];S[j]=t}
   i=0;j=0;
   for(var k=0;k<bytes.length;k++){i=(i+1)&255;j=(j+S[i])&255;var t2=S[i];S[i]=S[j];S[j]=t2;
    o[k]=bytes[k]^S[(S[i]+S[j])&255]}
   return o;
  }
  function hex(b){var s='',i;for(i=0;i<b.length;i++)s+=('0'+b[i].toString(16)).slice(-2);return s}
  function unhex(s){s=s.replace(/[^0-9a-f]/gi,'');var b=new Uint8Array(s.length/2),i;for(i=0;i<b.length;i++)b[i]=parseInt(s.substr(i*2,2),16);return b}
  function out(b){
   if(+$('rcF').value){var s='',i;for(i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);$('rcO').textContent=btoa(s)}
   else $('rcO').textContent=hex(b);
  }
  $('rcE').onclick=function(){
   var k=$('rcK').value;if(!k)return toast('请输入密钥');
   out(rc4(k,new TextEncoder().encode($('rcI').value)));
  };
  $('rcD').onclick=function(){
   var k=$('rcK').value,t=$('rcI').value.trim();if(!k)return toast('请输入密钥');
   var b;
   try{
    if(/^[0-9a-f\s]+$/i.test(t))b=unhex(t);
    else{var s=atob(t.replace(/\s+/g,'')),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);b=a}
   }catch(e){$('rcO').textContent='✗ 密文格式无法识别';return}
   $('rcO').textContent=new TextDecoder().decode(rc4(k,b));
  };
  $('rcC').onclick=function(){cp($('rcO').textContent)};
 }},
{id:'compass',n:'指南针',ic:'compass',c:'dev',tp:'l',d:'磁力方向实时指示',
 h:'<div class="card"><div style="position:relative;width:230px;height:230px;margin:6px auto 14px;border-radius:50%;background:var(--surf2);border:1px solid var(--bd)"><div id="coR" style="position:absolute;inset:16px;transition:transform .12s linear"><div style="position:absolute;left:50%;top:0;transform:translateX(-50%);font-size:12px;font-weight:500;color:var(--er)">N</div><div style="position:absolute;left:50%;bottom:0;transform:translateX(-50%);font-size:12px;color:var(--mu)">S</div><div style="position:absolute;top:50%;right:0;transform:translateY(-50%);font-size:12px;color:var(--mu)">E</div><div style="position:absolute;top:50%;left:0;transform:translateY(-50%);font-size:12px;color:var(--mu)">W</div><div style="position:absolute;left:50%;top:50%;width:2px;height:74px;margin-left:-1px;margin-top:-74px;background:#D93025;border-radius:1px"></div></div><div id="coD" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center"><div style="font-size:30px;font-weight:500;color:var(--p);font-variant-numeric:tabular-nums" id="coV">--°</div><div style="font-size:12px;color:var(--mu)" id="coT">点击开启</div></div></div><div class="row" style="justify-content:center"><button id="coG">开启指南针</button></div><div class="msg" id="coM">需要设备支持磁力计，移动端浏览器打开效果最佳</div></div>',
 k:function(){
  var on=false;
  var DIR=['北','东北','东','东南','南','西南','西','西北'];
  function handler(e){
   var h=e.webkitCompassHeading!==undefined?e.webkitCompassHeading:(e.alpha===null?null:360-e.alpha);
   if(h===null||h===undefined)return;
   h=(h+360)%360;
   $('coR').style.transform='rotate('+(-h)+'deg)';
   $('coV').textContent=h.toFixed(0)+'°';
   $('coT').textContent=DIR[Math.round(h/45)%8];
  }
  $('coG').onclick=function(){
   if(on){removeEventListener('deviceorientationabsolute',handler);removeEventListener('deviceorientation',handler);on=false;this.textContent='开启指南针';$('coT').textContent='已停止';return}
   function bind(){
    addEventListener('deviceorientationabsolute',handler,true);
    addEventListener('deviceorientation',handler,true);
    on=true;$('coG').textContent='停止';$('coT').textContent='等待数据';
    setTimeout(function(){if(on&&$('coT').textContent==='等待数据')$('coM').textContent='未收到传感器数据，当前设备可能没有磁力计'},1800);
   }
   if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission().then(function(r){r==='granted'?bind():toast('权限被拒绝')},function(){toast('授权失败')});
   }else if(window.DeviceOrientationEvent){bind()}
   else toast('当前环境不支持方向传感器');
  };
  this.clear=function(){removeEventListener('deviceorientationabsolute',handler);removeEventListener('deviceorientation',handler)};
 }},
{id:'level',n:'水平仪',ic:'level',c:'dev',tp:'l',d:'倾斜角度与气泡指示',
 h:'<div class="card"><div style="position:relative;width:220px;height:220px;margin:6px auto 14px;border-radius:50%;background:var(--surf2);border:1px solid var(--bd)"><div style="position:absolute;inset:26px;border-radius:50%;border:1px dashed #C7D8FB"></div><div style="position:absolute;inset:62px;border-radius:50%;border:1px dashed #DDE6F7"></div><div id="lvB" style="position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--p);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .1s linear"></div></div><div class="stat"><div class="st"><b id="lvX">0.0</b><span>左右倾角</span></div><div class="st"><b id="lvY">0.0</b><span>前后倾角</span></div><div class="st"><b id="lvS" style="font-size:15px">—</b><span>状态</span></div></div><div class="row"><button id="lvG">开启传感器</button><button class="gh" id="lvC">校准</button></div><div class="msg" id="lvM">需在移动端且支持重力感应</div></div>',
 k:function(){
  var on=false,ox=0,oy=0;
  function handler(e){
   var g=e.accelerationIncludingGravity;if(!g)return;
   var x=(g.x||0)-ox,y=(g.y||0)-oy;
   var ax=Math.atan2(x,9.81)*180/Math.PI,ay=Math.atan2(y,9.81)*180/Math.PI;
   $('lvX').textContent=ax.toFixed(1);$('lvY').textContent=ay.toFixed(1);
   var d=Math.min(1,Math.sqrt(x*x+y*y)/9.81*2.6);
   var ang=Math.atan2(y,x)*180/Math.PI;
   $('lvB').style.transform='translate('+(Math.cos(ang*Math.PI/180)*d*78).toFixed(1)+'px,'+(Math.sin(ang*Math.PI/180)*d*78).toFixed(1)+'px)';
   var m=Math.max(Math.abs(ax),Math.abs(ay));
   $('lvS').textContent=m<1?'水平':m<3?'接近水平':'倾斜 '+m.toFixed(1)+'°';
  }
  $('lvG').onclick=function(){
   var self=this;
   if(on){removeEventListener('devicemotion',handler);on=false;this.textContent='开启传感器';return}
   function start(){
    addEventListener('devicemotion',handler,true);on=true;self.textContent='停止';
    setTimeout(function(){if(on&&$('lvX').textContent==='0.0')$('lvM').textContent='未收到数据，当前设备可能不支持'},1800);
   }
   if(window.DeviceMotionEvent&&typeof DeviceMotionEvent.requestPermission==='function'){
    DeviceMotionEvent.requestPermission().then(function(r){r==='granted'?start():toast('权限被拒绝')},function(){toast('授权失败')});
   }else if(window.DeviceMotionEvent){start()}
   else toast('当前环境不支持运动传感器');
  };
  $('lvC').onclick=function(){ox=0;oy=0;toast('已校准为当前姿态')};
  this.clear=function(){removeEventListener('devicemotion',handler)};
 }},
{id:'noise',n:'噪音测量',ic:'mic',c:'dev',tp:'l',d:'麦克风实时分贝估算',
 h:'<div class="card"><div class="stat"><div class="st"><b id="nzD">--</b><span>当前 dB</span></div><div class="st"><b id="nzP">--</b><span>峰值 dB</span></div><div class="st"><b id="nzA">--</b><span>平均 dB</span></div></div><div style="height:120px;display:flex;align-items:flex-end;gap:2px;margin-top:14px" id="nzB"></div><div class="row" style="justify-content:center"><button id="nzGo">开始测量</button><button class="gh" id="nzR">重置</button></div><div class="msg" id="nzM">需授权麦克风；数值为估算值，非专业声级计</div></div>',
 k:function(){
  var ac=null,an=null,stream=null,data=null,peak=0,sum=0,cnt=0,bars=[],raf=null;
  for(var i=0;i<48;i++)bars.push(0);
  function draw(){
   $('nzB').innerHTML=bars.map(function(v){return '<div style="flex:1;height:'+Math.max(2,v*100)+'%;background:var(--p);border-radius:1px;transition:height .1s"></div>'}).join('');
  }
  function loop(){
   if(!an)return;
   an.getByteTimeDomainData(data);
   var s=0;
   for(var i=0;i<data.length;i++){var v=(data[i]-128)/128;s+=v*v}
   var rms=Math.sqrt(s/data.length);
   var db=rms>0?Math.max(0,20*Math.log10(rms)+94):0;
   peak=Math.max(peak,db);sum+=db;cnt++;
   bars.push(Math.min(1,db/100));bars.shift();
   $('nzD').textContent=db.toFixed(1);$('nzP').textContent=peak.toFixed(1);$('nzA').textContent=(sum/cnt).toFixed(1);
   draw();
   raf=requestAnimationFrame(loop);
  }
  $('nzGo').onclick=function(){
   var self=this;
   if(an){cancelAnimationFrame(raf);stream.getTracks().forEach(function(t){t.stop()});
    try{ac.close()}catch(e){};an=null;self.textContent='开始测量';return}
   if(!navigator.mediaDevices)return toast('当前环境不支持麦克风');
   navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
    stream=s;ac=new (window.AudioContext||window.webkitAudioContext)();
    var src=ac.createMediaStreamSource(s);an=ac.createAnalyser();an.fftSize=2048;data=new Uint8Array(an.fftSize);
    src.connect(an);$('nzM').textContent='测量中…';self.textContent='停止';loop();
   },function(e){$('nzM').textContent='无法访问麦克风：'+e.message});
  };
  $('nzR').onclick=function(){peak=0;sum=0;cnt=0;$('nzD').textContent='--';$('nzP').textContent='--';$('nzA').textContent='--';bars=bars.map(function(){return 0});draw()};
  draw();
  this.clear=function(){cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(function(t){t.stop()});try{if(ac)ac.close()}catch(e){}};
 }},
{id:'vibrate',n:'震动器',ic:'vib',c:'dev',tp:'l',d:'设备震动模式测试',

{id:'devinfo',n:'查看设备详细信息',ic:'cpu',c:'dev',tp:'l',d:'屏幕、硬件与浏览器能力',

   add('用户代理',n.userAgent);
   add('存储配额',n.storage&&n.storage.estimate?'检测中…':'不支持');
   var caps=[['摄像头','mediaDevices' in n&&!!n.mediaDevices.getUserMedia],['麦克风','mediaDevices' in n],['地理位置','geolocation' in n],
    ['通知','Notification' in window],['震动','vibrate' in n],['剪贴板','clipboard' in n],['语音合成','speechSynthesis' in window],
    ['WebGL',(function(){try{var c=document.createElement('canvas');return !!(c.getContext('webgl')||c.getContext('experimental-webgl'))}catch(e){return false}})()],
    ['ServiceWorker','serviceWorker' in n],['PWA 独立运行',window.matchMedia?matchMedia('(display-mode: standalone)').matches:false],['方向传感器','DeviceOrientationEvent' in window],['运动传感器','DeviceMotionEvent' in window]];
   L.push('');L.push('— 能力支持 —');

{id:'metal',n:'金属探测仪',ic:'magnet',c:'dev',tp:'l',d:'磁场强度变化检测',
 h:'<div class="card"><div style="text-align:center;padding:16px 0"><div id="mtV" style="font-size:38px;font-weight:500;color:var(--p);font-variant-numeric:tabular-nums">--</div><div style="font-size:12px;color:var(--mu)">磁场强度 μT</div></div><div style="height:14px;border-radius:7px;background:#EEF2FA;overflow:hidden"><div id="mtB" style="height:100%;width:0;background:var(--g);transition:width .12s"></div></div><div class="row" style="justify-content:center"><button id="mtGo">开始检测</button><button class="gh" id="mtC">校准基准</button></div><div class="msg" id="mtM">将设备缓慢靠近物体，数值明显变化处可能有金属；仅为粗略检测</div></div>',
 k:function(){
  var sen=null,base=null,on=false;
  function update(x,y,z){
   var m=Math.sqrt(x*x+y*y+z*z);
   if(base===null)base=m;
   $('mtV').textContent=m.toFixed(1);
   $('mtB').style.width=Math.min(100,Math.abs(m-base)/50*100)+'%';
   if(Math.abs(m-base)>12)$('mtM').textContent='检测到明显磁场变化（Δ'+(m-base).toFixed(1)+' μT）';
  }
  $('mtGo').onclick=function(){
   var self=this;
   if(on){try{sen.stop()}catch(e){};on=false;self.textContent='开始检测';return}
   if(!('Magnetometer' in window)){$('mtM').textContent='当前浏览器不支持 Magnetometer API（Chrome for Android 需开启相关实验特性）';return toast('设备不支持磁场传感器')}
   try{

   }catch(e){$('mtM').textContent='启动失败：'+e.message}

  this.clear=function(){if(sen)try{sen.stop()}catch(e){}};
 }},
